<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07090d">
<meta name="lift-build" content="r2">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>LIFT</title>
<style>
/* ── CSS 1. tokens + base ── */
:root{
  --bg:#07090d; --bg2:#0c1016; --s1:#10141b; --s2:#171d27; --s3:#222a38; --line:#262e3d;
  --panel:#10141b; --panel2:#171d27;
  --ink:#f3f5f9; --steel:#b9c2d1; --muted:#8892a3;
  --accent:#38bdf8; --accent-ink:#04121b; --ok:#4ade80; --warn:#fbbf24; --bad:#fb7185; --tagc:#c4b5fd;
  /* ONE accent (cyan) = LOG, current set, PLAN. Day colour (--day) only tints the tab underline + backdrop. */
  --kb:336px;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.25 var(--sys);
  overscroll-behavior:none;-webkit-text-size-adjust:100%;color-scheme:dark}
html{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,textarea,.note-ta,.sh-p,.daynote,.adm-in,.adm-ta{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;
  touch-action:manipulation;-webkit-appearance:none;appearance:none}
input,textarea{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;background:
  radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--day,var(--accent)) 9%,transparent),transparent 60%),var(--bg)}

/* ── CSS 2. header (one band: day tabs + note + menu) ── */
#hdr{flex:none;padding:max(6px,env(safe-area-inset-top)) 10px 0;display:grid;
  grid-template-columns:1fr auto;align-items:center;column-gap:2px}
.tabs{display:flex;gap:4px}
.tab{flex:1;height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;color:var(--muted);position:relative}
.tab b{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.tab i{font-style:normal;font-size:10.5px;opacity:.75;line-height:1.1}
.tab.on{background:var(--s2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--dc,var(--accent))}
.tab.today::after{content:'';position:absolute;top:6px;right:8px;width:5px;height:5px;
  border-radius:50%;background:var(--dc,var(--accent))}
.hbtns{display:flex}
.hbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  color:var(--steel);border-radius:12px}
.hbtn:active{background:var(--s2)}
.pr{grid-column:1/-1;display:flex;align-items:center;gap:8px;height:30px;padding:0 0 0 4px;
  font-size:13px;color:var(--muted)}
.pr .lk{flex:none;position:relative;height:28px;padding:0 9px;border-radius:9px;font-size:13px;font-weight:700;
  color:var(--steel);border:1px solid var(--line);white-space:nowrap}
.pr .lk::after{content:'';position:absolute;left:-4px;right:-4px;top:-2px;bottom:-14px}   /* hit area grows downward to ~44pt */
.pr .lk:active{background:var(--s3)}
.pr .brand{flex:none;font-weight:800;letter-spacing:.14em;color:var(--steel);font-size:11px;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pr .bar{flex:1;height:4px;border-radius:2px;background:var(--s3);overflow:hidden;display:block}
.pr .bar b{display:block;height:100%;width:0;background:var(--ok);border-radius:2px;transition:width .25s}
.pr .tx{flex:none;font-variant-numeric:tabular-nums}
.beta{flex:none;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--warn);
  border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);border-radius:6px;padding:1px 6px}

/* ── CSS 3. checklist ── */
#list{position:relative;flex:1;min-height:0;overflow-y:auto;padding:2px 10px 6px;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#list::-webkit-scrollbar{display:none}
#list.padpad{padding-bottom:124px}   /* room to scroll the last rows above the floating number pad */
.boot{padding:40px 20px;color:var(--muted);text-align:center}
.row{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;
  column-gap:11px;width:100%;height:44px;padding:0 4px 0 12px;border-radius:10px;text-align:left}
.row .gl{width:18px;height:18px;border-radius:50%;position:relative}
.row.part .gl{border:2px solid var(--accent);background:conic-gradient(var(--accent) var(--pc,50%),transparent 0)}
.row.dn .gl{background:var(--ok)}
.row.dn .gl::after{content:'';position:absolute;left:5.5px;top:2px;width:4px;height:8px;
  border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.row.sk .gl{border:2px dashed #4a5568}
.row .rt{min-width:0}
.rn{display:block;font-size:15px;font-weight:600;line-height:1.15;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.rs{display:block;font-size:11.5px;line-height:1.2;color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.rs:empty{display:none}
.row.dn .rn,.row.sk .rn{color:var(--steel);font-weight:500}
.row.dn .rs{color:#7fd9a0}
.row.cur{background:color-mix(in srgb,var(--accent) 15%,var(--s1));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 55%,transparent)}
.row.cur .rs{color:var(--steel)}
.row.sw .rn::after{content:' ⇄';color:var(--warn);font-weight:700}
.rr{display:flex;align-items:center;gap:8px}
.tg{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--tagc);
  border:1px solid color-mix(in srgb,var(--tagc) 50%,transparent);border-radius:5px;padding:1px 4px}
.row.ssm::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rc)}
.row.ssf::before{top:7px;border-radius:3px 3px 0 0}
.row.ssl::before{bottom:7px;border-radius:0 0 3px 3px}
.row.ssm:not(.ssf):not(.ssl)::before{border-radius:0}
.act{display:flex;align-items:center;justify-content:center;min-width:64px;height:44px;
  border-radius:10px;font-size:14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  background:var(--s3);color:var(--ink)}
.act.cx{color:var(--warn)}
.act.un{color:var(--accent);background:transparent;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent)}

/* ── CSS 4. player ── */
#player{flex:none;position:relative;z-index:5;display:flex;flex-direction:column;gap:4px;
  padding:4px 12px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#1a212d,#10141b 70%);
  border-radius:22px 22px 0 0;border-top:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));
  box-shadow:0 -14px 34px rgba(0,0,0,.55)}
#plId{display:flex;flex-direction:column;gap:4px}
.pl-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:2px;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pl-name{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.15;min-height:44px;
  display:flex;align-items:center;min-width:0;overflow:hidden}
.pl-name span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.pl-name.sm{font-size:16px;line-height:1.12}
.pl-btns{display:flex;align-items:center}
.pb{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border-radius:12px;color:var(--steel);font-size:12px;font-weight:700;padding:0 4px}
.pb:active{background:var(--s3)}
.pb.pill{border:1px solid var(--line);background:var(--s2);padding:0 9px;max-width:104px;margin-right:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:42px;border-radius:12px}
.pl-setrow{display:flex;align-items:center;gap:8px;height:44px}
.pl-set{display:flex;align-items:baseline;gap:6px;color:var(--accent);flex:none}
.pl-set small{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.pl-set b{font-size:38px;line-height:1;font-weight:800;letter-spacing:-.02em;color:var(--ink);
  font-variant-numeric:tabular-nums}
.pl-set.ed,.pl-set.ex{color:var(--warn)}
.pl-set.fn{color:var(--ok)}
.pl-set.ed b{color:var(--warn)}
.bdg{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--tagc);white-space:nowrap;
  border:1px solid color-mix(in srgb,var(--tagc) 50%,transparent);border-radius:5px;padding:1px 5px;
  line-height:1.3;margin-left:6px;vertical-align:1px}
.pl-ss{display:flex;gap:6px;height:44px}
.sst{flex:1 1 0;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);
  background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  padding:0 6px;font-size:13px;font-weight:600;color:var(--steel);line-height:1.2}
.sst span{max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sst b{flex:none;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.sst.on{border:2px solid var(--rc,var(--accent));color:var(--ink)}
.sst.on b{color:var(--ink)}
.sst.eye{flex:none;width:44px;padding:0;font-size:20px}
.pl-tl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl-tl>*{min-width:0;text-align:left;border-radius:10px;padding:0 2px}
.pl-tl small{display:block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);line-height:1.3;white-space:nowrap}
.pl-tl #plTv,.pl-tl #plLv{display:block;font-size:18px;font-weight:650;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;line-height:1.2;color:var(--ink)}
.pl-tl #plLv{color:var(--steel);font-weight:500;font-size:16px}
.pl-tl small #plPl{display:inline;margin-left:6px;font-size:13px;font-weight:500;letter-spacing:0;
  text-transform:none;color:var(--muted)}
.pl-tl #plLast{border-left:1px solid var(--line);height:44px;margin:-5px 0;padding:0 0 0 10px;border-radius:0;
  display:flex;flex-direction:column;justify-content:center}
.pl-sets{flex:1;min-width:0;display:flex;gap:6px;height:44px;overflow-x:auto;scrollbar-width:none}
.pl-sets::-webkit-scrollbar{display:none}
.sp{flex:1 0 52px;max-width:92px;height:44px;border-radius:12px;background:var(--s2);
  border:1px solid var(--line);font-size:14px;font-weight:700;color:var(--steel);display:flex;
  align-items:center;justify-content:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.sp.dn{background:color-mix(in srgb,var(--ok) 14%,var(--s2));
  border-color:color-mix(in srgb,var(--ok) 38%,var(--line));color:var(--ink)}
.sp.cu{border:2px solid var(--accent);color:var(--accent);background:transparent}
.sp.ed{border:2px solid var(--warn);color:var(--warn);background:transparent}
.sp.pe{color:var(--muted);border-style:dashed}
#plEntry{display:flex;flex-direction:column;gap:12px}   /* >= 12pt between weight row, rep strip and LOG */
.pl-w{display:flex;align-items:flex-end;gap:3px;height:56px}
.ws{flex:none;width:44px;height:44px;border-radius:11px;background:var(--s2);border:1px solid var(--line);
  font-size:13.5px;font-weight:700;color:var(--steel);font-variant-numeric:tabular-nums;padding:0}
.ws.sm{font-size:12.5px}
.ws:active{background:var(--s3)}
.wbox{flex:1;min-width:0;height:56px;position:relative;display:flex;align-items:center;
  justify-content:center;border-radius:12px}
#plW{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:0;
  font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--ink);
  font-variant-numeric:tabular-nums;border-radius:12px}
#plW.long{font-size:32px}
#plW.typing{box-shadow:0 0 0 2px var(--accent);background:var(--s1)}
#plW.fresh{color:var(--steel)}
#plW.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wcap{position:absolute;top:0;left:-30px;right:-30px;text-align:center;pointer-events:none;font-size:13px;
  font-weight:800;letter-spacing:.07em;white-space:nowrap;text-transform:uppercase;line-height:1;color:var(--muted)}
.wcap.plan{color:var(--accent)}
.wcap.same{color:var(--ink)}
.wcap.edit{color:var(--warn)}
.pl-bw{flex:1;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;
  color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pl-bw button{height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--s2);letter-spacing:0;text-transform:none;color:var(--steel);font-size:14px}
.pl-reps{position:relative;display:flex;gap:6px;height:44px;flex:none;overflow-x:auto;scrollbar-width:none;
  overscroll-behavior-x:contain}
.pl-reps::-webkit-scrollbar{display:none}
.ch{flex:0 0 46px;height:44px;border-radius:12px;background:var(--s3);font-size:18px;font-weight:700;
  color:var(--steel);font-variant-numeric:tabular-nums}
.ch.rg{color:var(--ink);background:#2a3447}
.ch.on{background:transparent;box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.ed-on .ch.on{box-shadow:inset 0 0 0 2px var(--warn);color:var(--warn)}
.ch:active{background:var(--accent);color:var(--accent-ink)}
#logRow{display:flex;gap:8px;margin-top:8px}
#logRow.nar #logBtn .l2{font-size:24px}
#logRow.nar #logBtn .lrow{gap:8px}
#logSide{display:flex;gap:8px;flex:none}
#logSide:empty{display:none}
.sb{width:84px;height:56px;border-radius:16px;background:var(--s2);border:1px solid var(--line);
  color:var(--steel);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;line-height:1.1;padding:0 4px}
.sb small{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;
  text-overflow:ellipsis}
.sb:active{background:var(--s3)}
.sb.rm{width:78px;color:var(--bad)}
.sb.rm.sure{background:var(--bad);color:#1a0509;border-color:var(--bad)}
.sb.rm.sure small{color:#1a0509}
.sb.un{color:var(--ink)}
#logBtn{flex:1;min-width:0;height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:800;
  box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 30%,transparent)}
#logBtn .lrow{display:flex;align-items:baseline;gap:12px}
#logBtn .l1{font-size:15px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
#logBtn .l2{font-size:30px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1}
#logBtn .l3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;line-height:1.1}
#logBtn:active{filter:brightness(.88);transform:scale(.995)}
#logBtn.ed{background:var(--warn)}
#logBtn.dis{background:var(--s3);color:var(--muted);box-shadow:none}
#logBtn.xtra{background:var(--s2);color:var(--steel);box-shadow:none;border:1px solid var(--line)}
#logBtn.xtra .l1{opacity:1;font-size:16px;letter-spacing:.04em}
#plFin{height:108px;border-radius:14px;border:1px dashed var(--line);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;text-align:center;color:var(--steel);font-size:15px}
#plFin b{font-size:22px;color:var(--ok)}
/* in-app numeric pad: floats just above the player so the player never moves or hides */
#pad{position:absolute;left:0;right:0;bottom:100%;z-index:4;display:grid;grid-template-columns:repeat(6,1fr);
  gap:6px;padding:10px 12px 8px;background:#0e131b;border-top:1px solid var(--line);
  box-shadow:0 -10px 24px rgba(0,0,0,.5)}
.k{height:44px;border-radius:12px;background:var(--s3);font-size:22px;font-weight:700;
  font-variant-numeric:tabular-nums}
.k:active{background:var(--accent);color:var(--accent-ink)}
.k.bs{font-size:18px;color:var(--steel)}
.pl-done{display:flex;flex-direction:column;gap:10px;justify-content:center;min-height:260px}
.pl-done h2{margin:0;font-size:26px;letter-spacing:-.02em}
.pl-done p{margin:0;color:var(--steel);font-size:14px}
.pl-done .bt{height:50px;border-radius:14px;background:var(--s3);font-weight:700;font-size:16px}
.pl-done .bt.pr1{background:var(--accent);color:var(--accent-ink)}

/* ── CSS 5. sheets ── */
#scrim{position:fixed;inset:0;z-index:90;background:rgba(2,4,8,.6)}
#sheet{position:fixed;z-index:100;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));
  max-height:calc(100% - 16px - env(safe-area-inset-top));display:flex;flex-direction:column;
  background:#10151d;border:1px solid var(--line);border-radius:20px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}
body.kbs #sheet{max-height:calc(100% - var(--kb) - 16px - env(safe-area-inset-top))}
.sh-h{flex:none;display:flex;align-items:center;gap:8px;padding:6px 6px 2px 16px}
.sh-t{flex:1;min-width:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.x{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--steel);
  border-radius:12px;font-size:20px}
.ctx{flex:none;margin:2px 14px 6px;padding:7px 12px;border-radius:12px;background:var(--bg2);
  border:1px solid var(--line);font-size:13px;color:var(--steel);line-height:1.35}
.ctx b{color:var(--ink)}
.ctx .c2{display:flex;gap:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx .c2 span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.sh-in{flex:none;margin:4px 14px 8px;height:46px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg2);padding:0 14px;font-size:17px;width:calc(100% - 28px);outline:0}
.sh-in:focus{border-color:var(--accent)}
.sh-b{flex:1;min-height:0;overflow-y:auto;padding:0 8px calc(12px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sh-p{padding:4px 16px 14px;color:var(--steel);font-size:15px;line-height:1.45;white-space:pre-wrap}
.sh-p b{color:var(--ink)}
.sh-k{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  padding:12px 10px 4px}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:46px;
  padding:0 10px;border-radius:10px;text-align:left;font-size:16px}
.li:active{background:var(--s3)}
.li small{color:var(--muted);font-size:12.5px}
.li.cu{color:var(--accent);font-weight:700}
.li.off{opacity:.45;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 10px 6px}
.chp{min-height:44px;padding:0 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line);
  font-size:15px;font-weight:600}
.hr{display:flex;gap:10px;align-items:center;padding:4px 12px;border-bottom:1px solid #1b2230;
  font-size:15px;min-height:46px}
.hr b{flex:none;width:44px;color:var(--steel)}
.hr span{flex:1;min-width:0;font-variant-numeric:tabular-nums}
.hr i{font-style:normal;font-size:11px;color:var(--muted);flex:none}
.hr .htag{flex:none;min-width:44px;height:44px;padding:0 10px;border-radius:10px;background:var(--s2);
  border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--steel)}
.ssv{padding:4px 14px 10px}

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   LIFT · guided session (checklist on top, player bar docked at the bottom)
   THIS FILE IS THE SOURCE. Hand-edit it. Sections (search for "═══ N."):
     1 constants + helpers      2 dates          3 stores        4 UI state + drafts
     5 sets/uneven (verbatim)   6 library        7 week slots    8 program + load chain
     9 native bridge           10 model         11 formatting   12 render
    13 logging + undo          14 sheets        15 events       16 core timer (verbatim)
    17 program warnings (verbatim)  18 admin (verbatim)         19 boot
   Verbatim = copied unchanged from the old app. Do not "tidy" them.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ═══ 1. constants + helpers ═══════════════════════════════════════════════ */
var PFX = (location.pathname.indexOf('/beta/') >= 0) ? 'liftbeta-' : 'lift-';   // CONTRACTS §2
var IS_BETA = (PFX === 'liftbeta-');
var K = {
  logs:PFX+'logs', notes:PFX+'notes', prog:PFX+'program-cache',
  ov:PFX+'overrides', tok:PFX+'pub-token', draft:PFX+'drafts'
};
var ORDER = ['mon','tue','wed','fri'];
var DAY_ACCENT = { mon:'#fb7185', tue:'#fbbf24', wed:'#a78bfa', fri:'#38bdf8' };
var SS_COLORS = ['#34d399','#f472b6','#a78bfa','#fbbf24'];
var DOW = { mon:1, tue:2, wed:3, fri:5 };
var PROGRAM = (typeof PROGRAM !== 'undefined') ? PROGRAM : null;   // set by program.js
var curDay = 'fri';          // plain global the verbatim core timer reads; render() keeps it = S.day
var $ = function(id){ return document.getElementById(id); };
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escA(s){ return escHtml(s).replace(/"/g,'&quot;'); }
function enc(s){ return encodeURIComponent(s); }
function dec(s){ return decodeURIComponent(s); }
function fmtW(n){ if(n==null||isNaN(n)) return ''; return String(Math.round(n*100)/100); }
function has(o,k){ return Object.prototype.hasOwnProperty.call(o,k); }
function shortName(n){ return String(n).split(/[·→(]/)[0].trim(); }
var TAG_LABEL = {
  dropset:'DROP SET', partials:'PARTIALS', restpause:'REST-PAUSE',
  amrap:'AMRAP', failure:'TO FAILURE', tempo:'SLOW TEMPO'
};
var TAG_SHORT = {
  dropset:'DROP', partials:'PARTIALS', restpause:'REST-PAUSE',
  amrap:'AMRAP', failure:'FAILURE', tempo:'TEMPO'
};
function tagText(t, map){ return map[String(t).toLowerCase()] || String(t).toUpperCase(); }

/* ═══ 2. dates / week window (local dates only — never toISOString) ═══════ */
function ymd(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayStr(){ return ymd(new Date()); }
function fmtDate(s){ var p=s.split('-'); return parseInt(p[1])+'/'+parseInt(p[2]); }
function anchorMonday(){
  var now=new Date(), dow=now.getDay(), m=new Date(now);
  m.setDate(now.getDate()-(dow===0?6:dow-1)); m.setHours(0,0,0,0); return m;
}
function reviewWindow(){
  var m=anchorMonday(), e=new Date(m); e.setDate(m.getDate()+6);
  return [ymd(m), ymd(e)];
}
function dateForWeekday(t){ var m=anchorMonday(); m.setDate(m.getDate()+(t-1)); return m; }
function defaultDayKey(){            // Thu -> Fri, Sat/Sun -> Mon
  switch(new Date().getDay()){
    case 1: return 'mon'; case 2: return 'tue'; case 3: return 'wed';
    case 4: return 'fri'; case 5: return 'fri'; default: return 'mon';
  }
}
var mmdd = function(d){ return String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'); };

/* ═══ 3. stores (write-through; the in-memory copy is the source of truth) ═ */
var memStore=null, memNotes=null;
function cleanLogs(o){                    // a malformed entry (no sets array) must not crash the app; nothing is deleted
  Object.keys(o).forEach(function(k){
    var h=o[k]; if(!Array.isArray(h)) return;
    h.forEach(function(e){ if(e && typeof e==='object' && !Array.isArray(e.sets)) e.sets=[]; });
  });
  return o;
}
function loadLogs(){
  if(memStore===null){
    memStore={};
    try{ var r=localStorage.getItem(K.logs);
      if(r){ var p=JSON.parse(r); if(p && typeof p==='object' && !Array.isArray(p)) memStore=cleanLogs(p); } }catch(e){}
  }
  return memStore;
}
function saveLogs(o){ memStore=o; try{ localStorage.setItem(K.logs, JSON.stringify(o)); }catch(e){} }
function loadNotes(){
  if(memNotes===null){
    memNotes={};
    try{ var r=localStorage.getItem(K.notes);
      if(r){ var o=JSON.parse(r); if(o && typeof o==='object') memNotes=o; } }catch(e){}
  }
  return memNotes;
}
function saveNotesObj(o){ memNotes=o; try{ localStorage.setItem(K.notes, JSON.stringify(o)); }catch(e){} }
function logsFor(name){ var h=loadLogs()[name]; return Array.isArray(h) ? h : []; }

/* ═══ 4. UI state + drafts + week-scoped swaps/adds ═══════════════════════ */
var S = {
  day:defaultDayKey(), pinned:false,
  wk:null,           // Monday of the week the in-memory drafts belong to (H10)
  extraOn:null,      // key of a finished slot where he chose "Add extra set"

/* ═══ 5. set count + uneven-superset note (VERBATIM from the old app) ═════ */

// Leading set count from a reps string (Ticket 24-A). The count is the number(s) BEFORE "×"/"x"
// (or before "sets"). For a set-RANGE ("2–3×…","3–4 × burnout") take the TOP so we never render
// fewer rows than prescribed. Returns null when there's no leading set count (e.g. "AMRAP","Bonus").
function setsOf(r){
  r=String(r);
  var i=r.search(/[×x]/);
  var head = i>=0 ? r.slice(0,i) : (/sets/i.test(r) ? r.slice(0, r.search(/sets/i)) : null);
  if(head==null) return null;
  var nums=head.match(/\d+/g);
  if(!nums || !nums.length) return null;
  return Math.max.apply(null, nums.map(Number));
}
function unevenNote(exs){
  var c=exs.map(function(e){return {name:e[0].split(/[·→]/)[0].trim(), n:setsOf(e[1])};}).filter(function(x){return x.n!=null;});
  if(c.length<2)return null;
  var mn=Math.min.apply(null,c.map(function(x){return x.n;}));
  var mx=Math.max.apply(null,c.map(function(x){return x.n;}));
  if(mn===mx)return null;
  var extra=c.filter(function(x){return x.n>mn;}).map(function(x){return x.name+' +'+(x.n-mn)+' solo';});
  return 'do '+mn+' as a superset, then '+extra.join(' · ');
}

  e.sets.push({w:w, r:r});
  saveLogs(all); if(created) moveNote();
  if(S.skipped[S.day+'|'+s.key]){ delete S.skipped[S.day+'|'+s.key]; saveDrafts(); }
  return {kind:'log', key:s.key, name:s.name, entry:e, created:created, listNew:listNew, prev:prev};
}
function updateSet(s, idx, w, r){          // explicit SAVE in edit mode; same slot, original date kept
  var e=s.entry; if(!e || !e.sets[idx]) return null;
  var st=e.sets[idx];
  var tok={kind:'edit', key:s.key, set:st, pw:st.w, pr:st.r, hadR:has(st,'r')};
  st.w=w; st.r=r; saveLogs(loadLogs());

}
function armUndo(tok){                     // ~10 s, or until the next write replaces it (H1)
  S.undo=tok; clearTimeout(undoT);
  undoT=setTimeout(function(){ S.undo=null; if(S.model && S.ctx){ drawList(); drawPlayer(); } }, 10000);
}
function clearUndo(){ clearTimeout(undoT); S.undo=null; }
function doUndo(){
  var u=S.undo; if(!u) return; clearUndo();
  var all=loadLogs(), ok=true;
  if(u.kind==='edit'){
    u.set.w=u.pw; if(u.hadR) u.set.r=u.pr; else delete u.set.r;
  } else if(u.kind==='rmset'){
    if(u.only){                            // put the very same entry object back where it was
      var h2=Array.isArray(all[u.name]) ? all[u.name] : (all[u.name]=[]);
      h2.splice(Math.min(u.pos,h2.length),0,u.entry);
    } else u.entry.sets.push(u.set);
  } else if(u.created){
    /* the entry was created by that very log: it is the last one pushed on its list.
       Removed by identity (pop), never by searching day/variant/tag/week. */
    var h=all[u.name];
    if(h && h.length && h[h.length-1]===u.entry){ h.pop(); if(!h.length && u.listNew) delete all[u.name]; }
    else ok=false;
  } else {
    u.entry.sets=u.prev;                  // restore the exact prior snapshot of THIS entry
  }
  if(!ok){ toast('Too late to undo — fix it from the set pill'); render(); return; }
  saveLogs(all); afterSave();
  S.sel=u.key; S.edit=null; S.manual=u.key;
  render();
}

var lastLogAt=0;
function doLog(r){
  var c=S.ctx; if(!c || !c.slot) return;
  var now=Date.now(); if(now-lastLogAt<150) return;          // a double-tap on LOG must not write two sets (H6)
  var s=c.slot, ed=editOf(s), idx=ed ? ed.idx : s.sets.length, showW=showWeight(s);
  var wv=weightFor(s,idx), w=showW ? wv.v : null;
  if(ed && !showW){ var cs=s.sets[ed.idx]; w=cs ? cs.w : null; }   // editor hidden: keep the saved weight, never null it (B1)
  if(showW && (w==null || isNaN(w) || w<=0)){ shakeW(); openPad(); return; }
  if(r==null){ r=repInfo(s,idx).r; if(r==null) return; }
  var tok; lastLogAt=now;
  if(ed){ tok=updateSet(s,ed.idx,w,r); S.edit=null; S.editW=null; if(!tok){ render(); return; } }
  else { tok=appendSet(s,w,r); delete S.work[wkey(s)]; saveDrafts(); }
  tok.txt=setTxt({w:w, r:r});
  S.typing=null; S.manual=null; S.padOff=null; S.rmArm=null; haptic();
  var slots=buildModel(), s2=null;
  slots.forEach(function(k){ if(k.key===s.key) s2=k; });
  if(!ed && s2 && s2.complete){                          // exercise just finished (or an extra set was added): move on (H5/H7)
    var nx=nextSlot(slots,s2);
    S.sel=nx ? nx.key : null; S.extraOn=null;
  }
  armUndo(tok); afterSave(); render();
  var lb=$('logBtn'); if(lb.animate) lb.animate([{transform:'scale(.97)'},{transform:'scale(1)'}],{duration:140});
}
/* Remove the LAST set of an entry (edit mode, second tap confirms). If it is the only set the entry goes —
   by reference (indexOf on the exact object), never by searching fields. Undo puts the same object back.
   Together with Undo-of-a-create this is the only place the app removes log data (flagged for Travis). */
var rmT=null;
function removeLastSet(){
  var s=cur(), ed=s && editOf(s); if(!s || !ed || !s.entry) return;
  if(ed.idx!==s.sets.length-1) return;
  if(!(S.rmArm && S.rmArm.key===s.key && S.rmArm.idx===ed.idx)){
    S.rmArm={key:s.key, idx:ed.idx}; clearTimeout(rmT);
    rmT=setTimeout(function(){ S.rmArm=null; if(S.model && S.ctx) drawPlayer(); }, 4000);
    drawPlayer(); return;
  }
  clearTimeout(rmT); S.rmArm=null;
  var all=loadLogs(), h=all[s.name], e=s.entry, set=e.sets[ed.idx], tok;
  if(!Array.isArray(h) || !set) return;
  if(e.sets.length>1){ e.sets.pop(); tok={kind:'rmset', key:s.key, entry:e, set:set, only:false}; }
  else {
    var pos=h.indexOf(e); if(pos<0) return;
    h.splice(pos,1); if(!h.length) delete all[s.name];
    tok={kind:'rmset', key:s.key, name:s.name, entry:e, set:set, only:true, pos:pos};
  }
  tok.txt='removed set '+(ed.idx+1);
  saveLogs(all); S.edit=null; S.editW=null; S.sel=s.key; S.manual=s.key;
  armUndo(tok); afterSave(); render();
}

function pickerList(q){
  /* order: [restore original] · coach alternates · library (prefix matches first when typing) · custom row LAST,
     and the custom row only when nothing matches the text exactly or by prefix. Enter = first match, else custom. */
  var ql=String(q||'').trim().toLowerCase(), s=S.sheetFor, h='', typed=String(q||'').trim();
  var row=function(n, small){ return '<button class="li" data-act="pickname" data-name="'+escA(n)+'"><span>'+escHtml(n)
    +'</span>'+(small ? '<small>'+escHtml(small)+'</small>' : '')+'</button>'; };
  var cands=[], seen={}, exact=false, prefix=false;
  if(S.sheetMode==='swap' && s){
    if(s.swapped && !s.logged) h+='<button class="li" data-act="pickname" data-name="'+escA(s.orig)
      +'"><span>↩ Restore original</span><small>'+escHtml(s.orig)+'</small></button>';
    altsFor(s.orig).forEach(function(a){ if(!seen[a] && a.toLowerCase().indexOf(ql)>=0){ seen[a]=1; cands.push({n:a, g:'Coach alternate'}); } });
  }
  pickerGroups().forEach(function(g){
    (g.names||[]).forEach(function(n){ if(!seen[n] && String(n).toLowerCase().indexOf(ql)>=0){ seen[n]=1; cands.push({n:n, g:g.label}); } });
  });
  cands.forEach(function(c){ var ln=String(c.n).toLowerCase(); if(ln===ql) exact=true; if(ql && ln.indexOf(ql)===0) prefix=true; });
  if(ql){                                   // typing: one flat list, best (prefix) matches on top
    var pre=cands.filter(function(c){ return String(c.n).toLowerCase().indexOf(ql)===0; });
    var rest=cands.filter(function(c){ return pre.indexOf(c)<0; });
    pre.concat(rest).forEach(function(c){ h+=row(c.n, c.g); });
    S.pickFirst=cands.length ? pre.concat(rest)[0].n : null;
  } else {
    var lastG=null;
    cands.forEach(function(c){ if(c.g!==lastG){ h+='<div class="sh-k">'+escHtml(c.g)+'</div>'; lastG=c.g; } h+=row(c.n); });
    S.pickFirst=null;
  }
  if(typed && !exact && !prefix) h+='<button class="li cu" data-act="pickname" data-name="'+escA(typed)+'"><span>Use “'
    +escHtml(typed)+'” (custom)</span><small>↵</small></button>';
  $('shBody').innerHTML=h;
}

/* ───────── Core / ab interval timer — pool + weekly shuffle (BUILD-QUEUE T03) ─────────
   Monday = weighted-leaning (CORE_TARGET-2 weighted + 2 bodyweight); any other day = all bodyweight.
   Each week the pools are seed-shuffled by ISO week → a fresh circuit every week.
   CORE_TARGET work intervals + two 30s rests. Paired moves run as two sided intervals;
   rests never split a pair. Pools are plain data — easy to edit (later: publishable). */
var CORE_TARGET = 6; // work intervals per circuit — single tunable constant (was 8; trimmed, felt long).
                     // Mon = CORE_TARGET-2 weighted + 2 bodyweight; rests fall at the thirds.
var AB_LEADIN = 10;  // first-core-timer lead-in ONLY — longer so there's time to get set (Ticket 19). Transitions stay AB_TRANS (5).

                     // Randomize tap bumps it, shifting the shuffle seed. Resets next open (by design —
                     // the circuit stays deterministic-by-week unless re-rolled in the moment).
var AB_TRANS  = 5;   // TRANSITION_SECONDS — prep window between exercises (Ticket 10); bump for slower weight swaps
var AB_POOLS = {

function ab_mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function ab_shuffle(arr,seed){var r=ab_mulberry32(seed);var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
// Pick moves from `pool` (already shuffled) until they fill exactly `target` work INTERVALS —
// counting a paired move as 2 intervals — so a pair can't overshoot the budget and starve the
// other pool. Returns the selected moves (still expanded to L/R by the caller).
function ab_fillIntervals(pool,target){
  var out=[], count=0;
  for(var i=0;i<pool.length && count<target;i++){
    var w=pool[i].pair?2:1;
    if(count+w<=target){ out.push(pool[i]); count+=w; }
  }
  return out;
}
function ab_isoWeek(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);var ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-ys)/86400000)+1)/7);}
// Build this week's circuit (CORE_TARGET work intervals + two 30s rests) deterministically from the day + ISO week.
function ab_buildCircuit(){
  // pools are publishable: if the live program JSON carries a `corePools` key, use it; else the bundled pools.
  var pools = (typeof PROGRAM==='object' && PROGRAM && PROGRAM.corePools
               && Array.isArray((PROGRAM.corePools.weightedPool)) && Array.isArray((PROGRAM.corePools.bodyweightPool)))
             ? PROGRAM.corePools : AB_POOLS;
  var now=new Date();
  var seed=ab_isoWeek(now)+AB_ROLL*7919;   // re-roll bump ×prime → a fully different shuffle per tap (T21)
  // Circuit follows the DAY BEING VIEWED (timer only shows Mon/Wed):
  // Monday = weighted-leaning pool, Wednesday = all bodyweight. Weekly seeded shuffle.
  var isWeighted=(curDay==='mon');
  var candidates;
  if(isWeighted){
    // Monday = (CORE_TARGET-2) weighted intervals + 2 bodyweight intervals. Select by INTERVAL
    // count (pairs = 2) so the 2 bodyweight moves are always guaranteed, then shuffle the order.
    var w=ab_shuffle(pools.weightedPool, seed);
    var b=ab_shuffle(pools.bodyweightPool, seed+101);
    var wsel=ab_fillIntervals(w, CORE_TARGET-2), bsel=ab_fillIntervals(b, 2);
    candidates=ab_shuffle(wsel.concat(bsel), seed+777);
  } else {
    candidates=ab_shuffle(pools.bodyweightPool, seed);
  }
  var TARGET=CORE_TARGET, work=[], pairStart=[];
  for(var k=0;k<candidates.length && work.length<TARGET;k++){
    var ex=candidates[k];
    if(ex.pair){
      if(work.length<=TARGET-2){                       // only if both sides fit (never truncate a pair)
        var lbl=ex.pairLabels||['L','R'];
        pairStart.push(work.length);
        work.push({ex:ex.ex+' — '+lbl[0], sec:ex.sec, note:ex.note});
        work.push({ex:ex.ex+' — '+lbl[1], sec:ex.sec, note:ex.note});
      }
    } else {
      work.push({ex:ex.ex, sec:ex.sec, note:ex.note});
    }
  }
  function restSlot(i){ return pairStart.indexOf(i-1)>=0 ? i+1 : i; }   // don't split a pair
  var restAt={}; [restSlot(Math.round(CORE_TARGET/3)),restSlot(Math.round(CORE_TARGET*2/3))].forEach(function(i){ if(i>0 && i<work.length) restAt[i]=1; });
  var seq=[];
  work.forEach(function(it,i){ if(restAt[i]) seq.push({rest:30}); seq.push(it); });
  var dayName=(PROGRAM[curDay]&&PROGRAM[curDay].title)||({mon:'Monday',wed:'Wednesday'}[curDay])||'Core';
  // Title carries NO week number (week-to-week model, T16/T18) — and never the raw seed,
  // which is meaningless after a re-roll bump. A re-rolled draw is marked so it's visible.
  return { seq:seq, work:work, title:dayName+' Core'+(AB_ROLL>0?' · re-rolled':'') };
}

var Ab = (function(){

  function buildPhases(){

    for(var f=0;f<seq.length;f++){ if(!seq[f].rest){ firstEx=seq[f].ex; break; } }
    phases=[{kind:'ready',label:circuitTitle,sec:AB_LEADIN,next:firstEx}];
    for(var i=0;i<seq.length;i++){
      var it=seq[i];
      if(it.rest){
        var nx=''; for(var j=i+1;j<seq.length;j++){ if(!seq[j].rest){ nx=seq[j].ex; break; } }

      } else {

      g.gain.setValueAtTime(0.0001,actx.currentTime);

    // dots = one per exercise
    el('abtDots').innerHTML = circuitWork.map(function(_,i){
      var cur=workIndex(pi); var cls = (p.kind==='work'&&i===cur-1)?'cur':(i<cur-1||(p.kind==='done'))?'done':(((p.kind==='rest'||p.kind==='trans')&&i<cur)?'done':'');
      return '<span class="abt-dot '+cls+'"></span>';
    }).join('');
    if(p.kind==='done'){
      // T22-B: the Workout Complete moment doubles as the day review — logged count +
      // any missed exercises, each tappable to backfill (closes the timer, opens its logger).
      var rvw=dayReviewData();
      el('abtList').innerHTML =
        '<div class="abt-review"><b>'+rvw.logged.length+'/'+rvw.total+'</b> exercises logged'+
        (rvw.missing.length
          ? ' — not logged:</div><div class="abt-review-list">'+rvw.missing.map(function(nm){
              return '<button class="rv-ex" data-rv="'+enc(nm)+'">'+escHtml(nm)+'</button>';
            }).join('')+'</div>'
          : ' — all logged ✓</div>');
    } else {
      el('abtList').innerHTML = circuitWork.map(function(it,i){
        var cur=workIndex(pi); var cls=(p.kind==='work'&&i===cur-1)?'cur':((i<cur-1||((p.kind==='rest'||p.kind==='trans')&&i<cur))?'done':'');
        return '<div class="abt-li '+cls+'"><span>'+(i+1)+'. '+escHtml(it.ex)+'</span><span>'+it.sec+'s</span></div>';
      }).join('');
    }
    el('abtPlay').textContent = running ? 'Pause' : (p.kind==='done' ? 'Restart' : (started ? 'Resume' : 'Start'));
    // Ticket 21: total-duration readout (visual only — never spoken). Pre-start: full circuit
    // total (lead-in + work + rests + transitions). Running: remaining total. Randomize is
    // pre-start only — hidden once the circuit has started.
    el('abtDur').textContent = started
      ? (p.kind==='done' ? '' : fmtMin(remainingTotal())+' left')
      : fmtMin(totalSecs())+' total';
    el('abtRoll').hidden = started;
  }
  // Sum of every countdown in the circuit (ready lead-in + work + rests + transitions; done=0).
  function totalSecs(){ var s=0; for(var i=0;i<phases.length;i++) s+=phases[i].sec||0; return s; }
  function remainingTotal(){ var s=remaining; for(var i=pi+1;i<phases.length;i++) s+=phases[i].sec||0; return s; }
  function fmtMin(s){ var m=Math.round(s/30)/2; return '~'+(m%1?m.toFixed(1):m)+' min'; }   // nearest half-minute
  function tick(){
    var now=Date.now();
    var r=Math.max(0, Math.round((endAt-now)/1000));
    if(r!==lastSec){
      lastSec=r;
      remaining=r;
      callout(phases[pi], r);
      draw();
    }
    if(now>=endAt) next(true);
  }
  function startTick(){ clearInterval(timer); timer=setInterval(tick,150); }
  function play(){
    if(phases[pi] && phases[pi].kind==='done'){ openFresh(); }
    running=true; started=true; endAt=Date.now()+remaining*1000; lastSec=-1;
    reqWake();
    // iOS only allows audio started from a user gesture — this tap is it.
    // Create + resume the AudioContext here so the later timer-tick beeps are audible.
    try{
      if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended') actx.resume();
    }catch(e){}
    if(!curAnnounced){ announcePhase(phases[pi]); curAnnounced=true; }   // speak current phase on first start
    startTick(); draw();
  }
  function pause(){ running=false; clearInterval(timer); relWake();
    try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){} draw(); }
  function next(auto){
    if(pi>=phases.length-1){ // finished
      running=false; clearInterval(timer); relWake();
      pi=phases.length-1; remaining=0; draw();
      if(auto){ beep(660,0.5,0.3); buzz([120,60,120,60,240]); announcePhase(phases[pi]); }
      return;
    }
    pi++; remaining=phases[pi].sec; lastSec=-1; curAnnounced=true;
    if(phases[pi].kind==='work'){ beep(1046,0.18,0.3); buzz(180); }      // exercise start
    else if(phases[pi].kind==='done'){ beep(660,0.5,0.3); buzz([120,60,120,60,240]); running=false; clearInterval(timer); relWake(); }   // terminal: stop the loop so the sec:0 done phase can't re-fire next() → completion fires exactly once (Ticket 19)
    else { beep(523,0.16,0.22); buzz(80); }                              // rest
    announcePhase(phases[pi]);
    if(running){ endAt=Date.now()+remaining*1000; }
    draw();
  }
  function prev(){ if(pi>0){ pi--; remaining=phases[pi].sec; lastSec=-1; curAnnounced=true;
    if(running) endAt=Date.now()+remaining*1000; announcePhase(phases[pi]); draw(); } }
  function reqWake(){ wakeWant=true; try{ if('wakeLock' in navigator) navigator.wakeLock.request('screen').then(function(w){ if(!wakeWant){ try{w.release();}catch(e){} return; } wake=w; }).catch(function(){}); }catch(e){} }
  function relWake(){ wakeWant=false; try{ wake&&wake.release&&wake.release(); }catch(e){} wake=null; }   // wakeWant guards the async race: a request that resolves AFTER a pause is released immediately
  function openFresh(){ buildPhases(); pi=0; remaining=phases[0].sec; running=false; started=false; lastSec=-1; curAnnounced=false; }
  function open(){ AB_ROLL=0; openFresh(); el('abtimer').hidden=false; liftWake(true); draw(); }   // fresh open → this day's default circuit (re-rolls don't leak to the next day)
  function close(){ running=false; clearInterval(timer); relWake(); liftWake(false);
    try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
    el('abtimer').hidden=true; }

  // wiring (overlay buttons are static)
  document.addEventListener('click',function(ev){
    var t=ev.target; if(t&&t.closest&&t.closest('[data-core-timer]')){ open(); }
  });
  // Ticket 21: pre-start re-roll — regenerate the circuit from the pools. Guarded against
  // returning the identical list twice in a row; silent (no beep/announce), pre-start only.
  function reroll(){
    if(started) return;
    var prev=circuitWork.map(function(w){return w.ex;}).join('|');
    for(var t=0;t<10;t++){
      AB_ROLL++;
      buildPhases();
      if(circuitWork.map(function(w){return w.ex;}).join('|')!==prev) break;
    }
    pi=0; remaining=phases[0].sec; lastSec=-1; curAnnounced=false;
    draw();
  }
  el('abtRoll').addEventListener('click',reroll);
  el('abtPlay').addEventListener('click',function(){ running?pause():play(); });
  el('abtSkip').addEventListener('click',function(){ next(false); });
  el('abtPrev').addEventListener('click',function(){ prev(); });
  el('abtClose').addEventListener('click',function(){ close(); });
  el('abtVoice').addEventListener('click',function(){
    voiceOn=!voiceOn;
    el('abtVoice').textContent = voiceOn ? '🔊' : '🔇';
    el('abtVoice').classList.toggle('off', !voiceOn);
    if(!voiceOn){ try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){} }
    else { say('Voice on'); }   // also primes speech within this tap
  });
  // re-acquire wake lock if the user tabs back while running
  document.addEventListener('visibilitychange',function(){ if(running && document.visibilityState==='visible') reqWake(); });

  return { open:open, close:close };
})();
/* ═══ 17. program key warnings (VERBATIM) ═════════════════════════════════ */
// Publish-time sanity: which recs/alts/plateMode keys DON'T match a real exercise name
// (the most common silent two-chat failure — a "·"/space/quote typo shows nothing).
function programKeyWarnings(prog){
  try{
    var names={}, variants={};
    ORDER.forEach(function(dk){ var d=prog[dk]; if(!d||!Array.isArray(d.A)) return;
      d.A.forEach(function(b){ (b.e||[]).forEach(function(ex){ if(ex&&ex[0]){ names[ex[0]]=1;
        var vs=variantsOf(ex[0]); if(vs) vs.forEach(function(v){ variants[v]=1; }); } }); }); });
    function known(n){ return !!(names[n]||variants[n]); }
    function q(s){ return '“'+s+'”'; }
    var warns=[];
    function warnBad(bad,label){ if(bad.length) warns.push(label+' for '+bad.slice(0,3).map(q).join(', ')+(bad.length>3?' +'+(bad.length-3):'')+' (no matching exercise — typo?)'); }
    function checkMap(obj,label){ if(obj && typeof obj==='object' && !Array.isArray(obj)){
      warnBad(Object.keys(obj).filter(function(k){ return !known(k); }), label); } }
    // recs/plates are DAY-NESTED ({mon:{"Exercise":val}, …}) — the exercise names are the INNER keys.
    // (The old flat check flagged mon/tue/wed/fri as unknown exercises on every valid publish.)
    function checkDayNested(obj,label){ if(obj && typeof obj==='object' && !Array.isArray(obj)){
      var bad=[]; ORDER.forEach(function(dk){ var day=obj[dk];
        if(day && typeof day==='object' && !Array.isArray(day)) Object.keys(day).forEach(function(k){ if(!known(k)) bad.push(k); }); });
      warnBad(bad, label); } }
    checkDayNested(prog.recs,'recs'); checkDayNested(prog.plates,'plates'); checkMap(prog.alts,'alts');
    if(Array.isArray(prog.plateMode)){ var bp=prog.plateMode.filter(function(k){ return !known(k); });
      if(bp.length) warns.push('plateMode '+bp.slice(0,3).map(q).join(', ')+(bp.length>3?' +'+(bp.length-3):'')+' (no matching exercise)'); }
    // Rich text is allowed ONLY in prog.t — everywhere else renders literally (escaped), so a
    // <b>/<i>/<span> outside prog.t is a paste mistake. Matches markup-SHAPED strings only;
    // plain "<45°" / "(<60s rest)" prose never warns.
    var TAG=/<\/?[a-z][^>]*>/i, htmlHits=[];
    function scanStr(s,where){ if(typeof s==='string' && TAG.test(s)) htmlHits.push(where); }
    ORDER.forEach(function(dk){ var d=prog[dk]; if(!d||typeof d!=='object') return;
      scanStr(d.title,dk+'.title'); scanStr(d.sub,dk+'.sub'); scanStr(d.warm,dk+'.warm');
      if(d.fin){ scanStr(d.fin.core,dk+'.fin.core'); scanStr(d.fin.cardio,dk+'.fin.cardio'); }
      (Array.isArray(d.A)?d.A:[]).forEach(function(b,bi){ if(!b) return; scanStr(b.w,dk+' block '+(bi+1)+' label');
        (b.e||[]).forEach(function(ex){ if(!ex) return;
          scanStr(ex[0],dk+' name '+q(String(ex[0]).slice(0,22)));
          scanStr(ex[1],dk+' reps of '+q(String(ex[0]).slice(0,22)));
          scanStr(ex[2],dk+' note of '+q(String(ex[0]).slice(0,22))); }); });
      var dp=prog.plates&&prog.plates[dk]; if(dp&&typeof dp==='object') Object.keys(dp).forEach(function(k){ scanStr(dp[k],dk+' plates '+q(k)); });
    });
    if(htmlHits.length) warns.push('HTML outside prog.t (will show as literal text): '+htmlHits.slice(0,3).join(', ')+(htmlHits.length>3?' +'+(htmlHits.length-3):'')+' — <b> is allowed only in prog.t');
    return warns;
  }catch(e){ return []; }
}
/* ═══ 18. publish screen (VERBATIM; token key prefixed, disabled in beta) ═══ */
/* ───────── Update Program (publish to Vercel; long-press the LIFT logo) ───────── */
var Admin = (function(){
  var g=function(id){ return document.getElementById(id); };
  var TOKEN_KEY=PFX+'pub-token';   /* CONTRACTS §2: prefixed key (only edit to this block, with the beta guard below) */
  function setStatus(msg,cls){ var s=g('admStatus'); s.textContent=msg||' '; s.className='adm-status'+(cls?' '+cls:''); }
  // One-tap clipboard read (iOS shows a Paste permission prompt). Falls back to manual paste.
  function pasteFromClipboard(){
    if(navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText().then(function(text){
        if(text && text.trim()){ g('admJson').value=text; validate(); }
        else { setStatus('Clipboard looks empty - copy the routine from the chat first.',''); g('admJson').focus(); }
      }).catch(function(){ setStatus('Could not read the clipboard - tap the box and paste manually.','err'); g('admJson').focus(); });
    } else { setStatus('Tap the box below and paste (hold, then Paste).',''); g('admJson').focus(); }
  }
  function parseInput(){
    var raw=g('admJson').value.trim();
    if(!raw) return {ok:false,msg:'Paste the routine JSON first.'};
    var data; try{ data=JSON.parse(raw); }catch(e){
      var m=String(e.message||''), pos=(m.match(/position (\d+)/)||[])[1];
      var near=pos!=null?(' — check near: …'+raw.slice(Math.max(0,pos-18), Number(pos)+12).replace(/\s+/g,' ')+'…'):'';
      return {ok:false,msg:'That isn’t valid JSON (a bracket, quote, or comma is off)'+near}; }
    var prog=normalizeProgram(data);
    if(!prog) return {ok:false,msg:'Parsed, but that is not a program object.'};
    var issue=programIssue(prog);                        // same strict check the app uses before adopting
    if(issue) return {ok:false,msg:issue};
    var days=Object.keys(prog).filter(function(k){return ORDER.indexOf(k)>=0;});
    return {ok:true,prog:prog,days:days,good:days.length};
  }
  function validate(){
    var v=parseInput();
    if(!v.ok){ setStatus('✕ '+v.msg,'err'); return null; }
    var warns=programKeyWarnings(v.prog);
    if(warns.length){ setStatus('✓ '+v.good+' days valid — heads up: '+warns.join(' · '),'warn'); }
    else { setStatus('✓ Looks good — '+v.good+' day(s): '+v.days.join(', '),'ok'); }
    return v;   // warnings don't block publishing (keys may be intentional)
  }
  function publish(){
    var v=validate(); if(!v) return;
    var token=g('admToken').value.trim();
    if(!token){ setStatus('✕ Enter your publish token.','err'); return; }
    setStatus('Publishing…','');
    fetch(PROGRAM_API,{method:'POST',headers:{'content-type':'application/json','x-program-secret':token},body:JSON.stringify(v.prog)})
      .then(function(r){ return r.json().then(function(j){return {s:r.status,j:j};},function(){return {s:r.status,j:null};}); })
      .then(function(o){
        if(o.s===200){
          try{ localStorage.setItem(TOKEN_KEY, token); }catch(e){}
          setCachedProgram(v.prog); PROGRAM=v.prog; render();
          g('admJson').value='';                 // auto-clear the paste box after a successful publish
          setStatus('✓ Published — this week’s routine is now live on all your devices.','ok');
        } else if(o.s===401){ setStatus('✕ Wrong publish token.','err'); }
        else { setStatus('✕ '+((o.j&&o.j.error)||('error '+o.s)),'err'); }
      })
      .catch(function(){ setStatus('✕ Network error — try again.','err'); });
  }
  function open(){ if(IS_BETA) return;   /* publish is read-only in beta */ try{ g('admToken').value=localStorage.getItem(TOKEN_KEY)||''; }catch(e){} setStatus(' '); g('admin').hidden=false; }
  function close(){ g('admin').hidden=true; }

  g('admClose').addEventListener('click',close);
  g('admPaste').addEventListener('click',pasteFromClipboard);
  g('admClear').addEventListener('click',function(){ g('admJson').value=''; setStatus(' '); g('admJson').focus(); });
  g('admValidate').addEventListener('click',validate);
  g('admPublish').addEventListener('click',publish);

  // Primary, reliable entry: the gear in the nav (a normal tap).
  var gear=g('navGear'); if(gear) gear.addEventListener('click',function(e){ e.stopPropagation(); open(); });

  // Secondary: long-press the LIFT logo. Don't cancel on pointercancel — iOS
  // WKWebView fires it spuriously when it starts its own long-press gesture,
  // which used to kill the timer before it opened.
  var brand=document.querySelector('.brand'), lp=null;
  function lpStart(){ lp=setTimeout(open,600); }
  function lpEnd(){ if(lp){ clearTimeout(lp); lp=null; } }
  if(brand){
    brand.style.userSelect='none'; brand.style.webkitUserSelect='none';
    brand.addEventListener('pointerdown',lpStart);
    brand.addEventListener('pointerup',lpEnd);
    brand.addEventListener('pointerleave',lpEnd);
    brand.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  }
  return { open:open, close:close };
})();

/* ═══ 19. boot ═════════════════════════════════════════════════════════════ */
(function(){
  loadDrafts();
  var c=cachedProgram();
  if(c && !programIssue(c)){ PROGRAM=c; GOOD=c; S.boot=false; }     // 1) render the valid cache at once
  render();
  loadProgram(true);                                         // 2) then ask the API
  setTimeout(function(){ if(S.boot) loadBundled(); }, 1200);   // no cache + weak signal: fetch the bundled program (async, never blocks)
  if(IS_BETA) document.title='LIFT β';
  liftSyncLogs();
})();
