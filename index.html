<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>LIFT — 4-Day Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1117; --bg2:#11151c; --panel:#161b23; --panel2:#1b212b;
    --ink:#e8edf4; --muted:#8893a3; --line:#242c38; --steel:#aeb9c9;
    --accent:#7dd3fc; --accent-ink:#06131c;   /* Slate theme accent */
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{overflow-x:hidden;}
  button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;}
  body{
    font-family:'Barlow',sans-serif;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;min-height:100vh;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(45,212,191,.07), transparent 60%),
      radial-gradient(900px 500px at -10% 20%, rgba(251,113,153,.06), transparent 55%),
      linear-gradient(180deg,var(--bg),var(--bg2));
    background-attachment:fixed; color:var(--ink); line-height:1.45;
    padding:0 0 48px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:500px;margin:0 auto;padding:14px;}

  /* ---------- sticky nav ---------- */
  .nav{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,rgba(11,13,18,.96),rgba(11,13,18,.86));
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:max(10px,env(safe-area-inset-top)) 14px 10px;
  }
  .nav-inner{max-width:500px;margin:0 auto;}
  .days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .day-btn{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:.82rem;
    letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
    border:1px solid var(--line);border-radius:10px;background:var(--panel);
    color:var(--muted);min-height:46px;padding:0;transition:.15s;text-align:center;
  }
  .day-btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}

  /* ---------- header ---------- */
  .head{position:relative;border:1px solid var(--line);border-radius:16px;
    padding:18px 18px 15px;background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,0));
    overflow:hidden;animation:rise .45s ease both;}
  .head::before{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:100% 7px;opacity:.5;pointer-events:none;}
  .kicker{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.32em;
    text-transform:uppercase;font-size:.68rem;color:#2dd4bf;}
  h1{font-family:'Anton',sans-serif;font-weight:400;font-size:2.9rem;line-height:.92;
    text-transform:uppercase;margin:4px 0 5px;}
  .sub{font-family:'Oswald',sans-serif;font-weight:500;text-transform:uppercase;
    letter-spacing:.1em;color:var(--steel);font-size:.9rem;}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;}
  .tag{font-family:'Oswald',sans-serif;font-size:.64rem;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);}
  .tag.pri{color:var(--bg);background:#fb7199;border-color:#fb7199;}
  .tag.main{color:var(--bg);background:#9fb0c9;border-color:#9fb0c9;}

  .rules{margin-top:11px;border:1px dashed var(--line);border-radius:12px;padding:10px 13px;
    display:flex;gap:7px 15px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);}
  .rules b{color:var(--ink);font-weight:600;}

  .warm{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:var(--panel);animation:rise .45s .04s ease both;}
  .warm .lab{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:.7rem;color:var(--muted);margin-bottom:3px;}
  .warm p{font-size:.9rem;color:var(--steel);}

  /* ---------- cards ---------- */
  .group{margin-top:13px;animation:rise .45s ease both;}
  .solo-tag{font-family:'Oswald',sans-serif;font-size:.6rem;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);margin:0 0 6px 4px;}
  .ex-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
  .set-badge{font-family:'Oswald',sans-serif;font-size:.56rem;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:#ffcf5c;border:1px solid rgba(255,207,92,.45);border-radius:6px;padding:2px 7px;}
  .uneven{margin-top:9px;border-radius:9px;background:rgba(255,207,92,.12);
    border:1px dashed rgba(255,207,92,.55);color:#ffe2a0;font-family:'Oswald',sans-serif;
    font-size:.7rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    padding:8px 10px;text-align:center;line-height:1.35;}

  .fin{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);
    padding:13px 15px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;animation:rise .45s .1s ease both;}
  .fin .core-block{flex:1;min-width:140px;}
  .fin .lab{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:.66rem;color:var(--muted);}
  .fin .val{font-family:'Oswald',sans-serif;font-weight:600;font-size:.95rem;color:var(--steel);margin-top:2px;}

  .notes{margin-top:16px;}
  .notes-lab{font-family:'Oswald',sans-serif;font-weight:600;font-size:.66rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin:0 2px 6px;}
  .notes-ta{width:100%;min-height:84px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    color:var(--ink);font-size:.92rem;padding:12px;font-family:'Barlow',sans-serif;resize:vertical;
    line-height:1.45;-webkit-appearance:none;appearance:none;}
  .notes-ta:focus{outline:none;border-color:var(--accent);}
  .notes-ta::placeholder{color:var(--muted);opacity:.65;}
  .prog{margin-top:11px;border-left:4px solid var(--pc,#fb9a3c);border-radius:6px;
    background:color-mix(in srgb,var(--pc,#fb9a3c) 9%,var(--panel));padding:11px 14px;font-size:.84rem;color:var(--steel);animation:rise .45s .12s ease both;}
  .prog b{color:var(--ink);}

  .legend{margin-top:16px;display:flex;gap:13px;flex-wrap:wrap;justify-content:center;
    font-family:'Oswald',sans-serif;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .legend span{display:flex;align-items:center;gap:6px;}
  .dot{width:11px;height:11px;border-radius:3px;}

  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* compact phones */
  @media (max-width:360px){
    .wrap{padding:12px;}
    h1{font-size:2.4rem;}
    .ex .name{font-size:.95rem;}
    .reps{font-size:1rem;}
    .day-btn{font-size:.74rem;letter-spacing:.06em;}
  }
  /* never let a row push sideways */
  .card{flex-wrap:nowrap;}
  .ex{overflow-wrap:anywhere;}

  /* brand */
  .brand{font-family:'Anton',sans-serif;font-size:1.05rem;letter-spacing:.05em;color:var(--ink);
    display:flex;align-items:center;gap:7px;margin-bottom:9px;}
  .brand .dotmark{width:11px;height:11px;border-radius:3px;
    background:linear-gradient(135deg,#4ade80,#2dd4bf);transform:rotate(30deg);flex:none;}
  .brand{-webkit-touch-callout:none;}
  .nav-gear{margin-left:10px;background:none;border:none;color:var(--muted);font-size:1.05rem;line-height:1;
    cursor:pointer;padding:4px 6px;border-radius:8px;flex:none;-webkit-tap-highlight-color:transparent;}
  .nav-gear:active{color:var(--ink);background:var(--panel);}
  .brand small{font-family:'Oswald',sans-serif;font-weight:500;font-size:.6rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);margin-left:auto;}

  /* logging + history */
  .logbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 4px 0 10px;}
  .last{font-family:'Oswald',sans-serif;font-size:.78rem;color:var(--steel);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .last b{color:var(--ink);font-weight:600;}
  .last.empty{opacity:.45;font-style:italic;}
  .last.done{color:#7ef0b0;}
  .last.done b{color:#7ef0b0;}
  .logbtns{display:flex;gap:6px;flex:none;}
  .log-btn,.hist-btn{font-family:'Oswald',sans-serif;font-weight:600;font-size:.68rem;
    letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:9px;
    border:1px solid var(--line);background:transparent;color:var(--muted);padding:0 13px;min-height:36px;}
  .log-btn{color:#06231f;background:#2dd4bf;border-color:#2dd4bf;font-weight:700;}
  .exblock.done .log-btn{background:transparent;color:#7ef0b0;border-color:color-mix(in srgb,#4ade80 45%,var(--line));}
  .log-panel{margin:7px 2px 0;border:1px solid var(--line);border-radius:12px;
    background:var(--panel2);padding:11px;}
  .panel-hint{font-size:.74rem;color:var(--muted);margin:0 2px 10px;line-height:1.35;}
  /* weight-only set rows — one compact line each */
  .setrow{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);
    border-radius:11px;padding:8px 9px;margin-bottom:8px;}
  .setrow .si{font-family:'Oswald',sans-serif;font-weight:700;font-size:.64rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--steel);flex:none;width:46px;}
  .stp{width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:10px;
    background:var(--panel);color:var(--ink);font-size:1.5rem;line-height:1;cursor:pointer;
    font-family:'Barlow',sans-serif;display:flex;align-items:center;justify-content:center;}
  .stp:active{background:var(--panel2);}
  .in-w{width:72px;height:44px;flex:none;text-align:center;background:var(--bg2);
    border:1px solid color-mix(in srgb,#2dd4bf 34%,var(--line));border-radius:9px;color:var(--ink);
    font-size:1.18rem;font-weight:700;padding:0 4px;font-family:'Barlow',sans-serif;
    -webkit-appearance:none;appearance:none;}
  .in-w:focus{outline:none;border-color:#2dd4bf;}
  .in-w::placeholder{color:var(--muted);opacity:.5;font-weight:400;}
  .unit{font-family:'Oswald',sans-serif;font-size:.66rem;color:var(--muted);text-transform:uppercase;
    letter-spacing:.06em;flex:none;}
  .setrow .rm{width:30px;height:30px;flex:none;margin-left:auto;border:1px solid var(--line);
    border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1;}
  /* plate-mode picker */
  .setrow.plate{display:block;padding:9px 10px;}
  .prow-head{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
  .prow-head .si{width:auto;}
  .pstack{flex:1;min-width:0;font-family:'Oswald',sans-serif;font-weight:600;font-size:.95rem;color:var(--accent);
    text-transform:uppercase;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pstack-empty{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0;opacity:.7;}
  .ptotal{font-family:'Anton',sans-serif;font-size:1.05rem;color:var(--steel);flex:none;white-space:nowrap;}
  .pbtns{display:flex;gap:6px;flex-wrap:wrap;}
  .pbtn{min-width:42px;height:42px;border:1px solid var(--line);border-radius:9px;background:var(--bg2);
    color:var(--ink);font-family:'Barlow',sans-serif;font-weight:700;font-size:.92rem;cursor:pointer;padding:0 8px;}
  .pbtn:active{background:var(--panel2);}
  .pbtn.paux{font-weight:600;color:var(--muted);background:transparent;font-size:.84rem;min-width:38px;}
  .panel-actions{display:flex;gap:8px;margin-top:2px;}
  .panel-actions button{flex:1;min-height:42px;border-radius:10px;cursor:pointer;
    font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    font-size:.72rem;border:1px solid var(--line);background:transparent;color:var(--muted);}
  .btn-add{flex:.7;}
  .btn-save{background:#2dd4bf;color:#06231f;border-color:#2dd4bf;}
  .hist-list{max-height:190px;overflow-y:auto;margin-bottom:9px;}
  .hist-item{font-family:'Oswald',sans-serif;font-size:.74rem;color:var(--muted);
    padding:5px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);}
  .hist-item:last-child{border-bottom:none;}
  .hist-item b{color:var(--ink);font-weight:600;}
  .saved-flash{color:#2dd4bf;font-size:.85rem;font-family:'Oswald',sans-serif;font-weight:700;
    letter-spacing:.08em;text-align:center;padding:14px;}

  /* logged-today state */
  .exblock.done .accent{background:linear-gradient(180deg,#4ade80,#2dd4bf);}
  .exblock.done .card{border-color:color-mix(in srgb,#4ade80 28%,var(--line));}
  .ss .exblock.done .card{border-color:color-mix(in srgb,#4ade80 30%,var(--c));}

  /* today progress bar */
  .today{display:flex;align-items:center;gap:11px;margin-top:13px;}
  .today-bar{flex:1;height:9px;border-radius:99px;background:var(--panel2);
    border:1px solid var(--line);overflow:hidden;}
  .today-bar span{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#4ade80,#2dd4bf);transition:width .4s ease;}
  .today-lab{font-family:'Oswald',sans-serif;font-weight:600;font-size:.68rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);flex:none;}
  .today-lab b{color:#7ef0b0;font-weight:700;}

  /* re-render: skip the entrance animation after first paint */
  body.ready .head,body.ready .warm,body.ready .group,body.ready .fin,
  body.ready .prog,body.ready .today{animation:none;}

  /* ───────── Slate theme — cohesive cool accent, minimal chrome ───────── */
  body{background:linear-gradient(180deg,#0e1117,#11151c);background-attachment:fixed;}
  .head::before{opacity:.25;}
  .brand .dotmark{background:linear-gradient(135deg,var(--accent),#a5b4fc);}
  .kicker{color:var(--accent);letter-spacing:.34em;}
  .day-btn{color:color-mix(in srgb,var(--dc,var(--muted)) 80%,#c9d2de);}
  .day-btn.on{background:var(--dc,var(--accent));color:#0b0f16;border-color:transparent;}
  /* T05: 2-line day tabs (label + current-week date) + today marker */
  .day-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:50px;line-height:1.05;}
  .db-date{font-family:'Oswald',sans-serif;font-weight:500;font-size:.6rem;letter-spacing:.02em;
    text-transform:none;color:var(--muted);}
  .day-btn.on .db-date{color:rgba(11,15,22,.6);}
  .today-marker{position:absolute;top:16px;right:18px;z-index:1;font-family:'Oswald',sans-serif;
    font-weight:600;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);}
  .today-marker b{color:var(--accent);font-weight:700;}
  .tag.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .tag.main{background:transparent;color:var(--steel);border-color:var(--line);}
  .prog{border-left-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 8%,var(--panel));}
  .log-btn{background:var(--ink);color:#11151c;border-color:transparent;}
  .exblock.done .log-btn{background:transparent;color:var(--accent);
    border-color:color-mix(in srgb,var(--accent) 45%,var(--line));}
  .exblock.done .accent{background:var(--accent);}
  .exblock.done .card{border-color:color-mix(in srgb,var(--accent) 26%,var(--line));}
  .ss .exblock.done .card{border-color:color-mix(in srgb,var(--accent) 30%,var(--c));}
  .last.done,.last.done b{color:var(--accent);}
  .today-bar span{background:var(--accent);}
  .today-lab b{color:var(--accent);}
  .in-w{border-color:color-mix(in srgb,var(--accent) 30%,var(--line));}
  .in-w:focus{border-color:var(--accent);}
  .panel-actions .btn-save{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;}
  .saved-flash{color:var(--accent);}

  /* ───────── accordion workout (T04) ───────── */
  .blk{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;}
  .blk.ss{border-color:color-mix(in srgb,var(--c) 45%,var(--line));
    background:linear-gradient(180deg,color-mix(in srgb,var(--c) 9%,transparent),transparent 70%),var(--panel);}
  .bhead{display:flex;align-items:center;gap:11px;padding:13px 14px;width:100%;border:none;background:none;color:inherit;text-align:left;cursor:pointer;}
  .bhead .acc{width:5px;align-self:stretch;border-radius:5px;background:var(--c,var(--steel));flex:none;min-height:34px;}
  .exblock.done .bhead .acc,.exblock.done .exhead .acc{background:var(--accent);}
  .bhead .ttl{flex:1;min-width:0;}
  .bhead .where{font-family:'Oswald',sans-serif;font-weight:600;font-size:.98rem;letter-spacing:.01em;text-transform:uppercase;}
  .blk.ss .bhead .where{color:var(--c);}
  .bhead .names{font-size:.76rem;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bhead .rp{font-family:'Anton',sans-serif;font-size:1.04rem;color:var(--steel);flex:none;white-space:nowrap;}
  .cnt{font-family:'Oswald',sans-serif;font-weight:700;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;
    color:var(--c,var(--steel));border:1px solid color-mix(in srgb,var(--c,var(--steel)) 40%,var(--line));border-radius:20px;padding:2px 9px;flex:none;}
  .cnt.alldone{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));}
  .chev{flex:none;color:var(--muted);font-size:1rem;transition:transform .2s;font-family:'Barlow',sans-serif;}
  .blk.open>.bhead .chev,.exrow.open>.exhead .chev{transform:rotate(180deg);}
  .bbody,.exbody{display:none;}
  .blk.open>.bbody{display:block;padding:0 11px 11px;}
  .exrow.open>.exbody{display:block;padding:2px 12px 13px;}
  .done-mini{font-family:'Oswald',sans-serif;font-size:.72rem;color:var(--accent);margin-top:4px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tick{color:var(--accent);font-weight:700;margin:0 2px;flex:none;}
  .exrow{border:1px solid color-mix(in srgb,var(--c) 22%,var(--line));border-radius:11px;background:var(--panel2);margin-top:8px;overflow:hidden;}
  .exhead{display:flex;align-items:center;gap:10px;padding:11px 12px;width:100%;border:none;background:none;color:inherit;text-align:left;cursor:pointer;}
  .exhead .acc{width:4px;align-self:stretch;border-radius:4px;background:var(--c,var(--accent));flex:none;min-height:28px;}
  .exhead .nm{flex:1;min-width:0;font-family:'Oswald',sans-serif;font-weight:600;font-size:.96rem;text-transform:uppercase;}
  .exhead .rp{font-family:'Anton',sans-serif;font-size:1rem;color:var(--c,var(--accent));flex:none;white-space:nowrap;}
  .uneven{margin:8px 0 2px;}
  /* variant selector — which machine the weights belong to */
  .vsel{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:4px 0 11px;}
  .vsel-lab{font-family:'Oswald',sans-serif;font-weight:600;font-size:.58rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);flex:none;margin-right:2px;}
  .vchip{font-family:'Oswald',sans-serif;font-weight:600;font-size:.7rem;letter-spacing:.04em;
    text-transform:uppercase;border:1px solid var(--line);border-radius:9px;background:transparent;
    color:var(--muted);padding:8px 12px;cursor:pointer;}
  .vchip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;}
  /* rec card */
  .rec{display:flex;align-items:flex-end;gap:14px;margin:6px 0 11px;}
  .rec .sug{font-family:'Anton',sans-serif;font-size:2.3rem;line-height:.9;color:var(--accent);}
  .rec .sug small{font-family:'Oswald',sans-serif;font-size:.78rem;letter-spacing:.06em;margin-left:3px;}
  .rec .meta{padding-bottom:5px;}
  .rec .lab{font-family:'Oswald',sans-serif;font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  .rec .rng{font-family:'Oswald',sans-serif;font-weight:600;font-size:.92rem;color:var(--steel);}
  .cue{border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--panel2));

<script src="program.js"></script>
<script>
// Each superset gets its own color so its exercises read as a linked group.
const SS_COLORS = ['#34d399','#f472b6','#a78bfa','#fbbf24'];   // emerald · pink · violet · amber

// Each training day has its own accent color (drives the header, nav, progress, done-state).
const DAY_ACCENT = { mon:'#fb7185', tue:'#fbbf24', wed:'#a78bfa', fri:'#38bdf8' };  // rose · amber · violet · sky
function applyDayAccent(day){
  var c=DAY_ACCENT[day]||'#7dd3fc';
  document.documentElement.style.setProperty('--accent', c);
  document.documentElement.style.setProperty('--accent-ink', '#0b0f16');
}

let curDay='fri', curWk='A';
const ORDER=['mon','tue','wed','fri'];
var openEx=null;     // encoded name of the single expanded exercise (one log card open at a time)
var openBlk={};      // block index → 1 (expanded superset showing its exercise rows)
function rerender(){ var y=window.scrollY; render(); window.scrollTo(0,y); }   // keep scroll on expand/collapse

const DOW={mon:1,tue:2,wed:3,fri:5};   // weekday index, Mon=1 … Sun=7
function dateForWeekday(targetDow){
  const now=new Date();
  const cur=now.getDay()||7;                 // 1..7 (Sun→7)
  const monday=new Date(now); monday.setDate(now.getDate()-(cur-1));   // this week's Monday
  const d=new Date(monday); d.setDate(monday.getDate()+(targetDow-1));
  return d;
}
const mmdd=(d)=>String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
function todayMarker(){ var n=new Date(); return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][n.getDay()]+' <b>'+mmdd(n)+'</b>'; }
function buildNav(){
  const days=document.getElementById('days');
  days.innerHTML=ORDER.filter(d=>PROGRAM[d]&&PROGRAM[d].title).map(d=>`<button class="day-btn ${d===curDay?'on':''}" data-d="${d}" style="--dc:${DAY_ACCENT[d]||'#7dd3fc'}"><span class="db-lab">${PROGRAM[d].title.slice(0,3)}</span><span class="db-date">${mmdd(dateForWeekday(DOW[d]))}</span></button>`).join('');
  days.querySelectorAll('button').forEach(b=>b.onclick=()=>{curDay=b.dataset.d;openEx=null;openBlk={};render();});
}

function setsOf(r){r=String(r);var m=r.match(/^(\d+)/);if(!m)return null;return (/[×x]/.test(r)||/sets/i.test(r))?parseInt(m[1]):null;}
function unevenNote(exs){
  var c=exs.map(function(e){return {name:e[0].split(/[·→]/)[0].trim(), n:setsOf(e[1])};}).filter(function(x){return x.n!=null;});
  if(c.length<2)return null;
  var mn=Math.min.apply(null,c.map(function(x){return x.n;}));
  var mx=Math.max.apply(null,c.map(function(x){return x.n;}));
  if(mn===mx)return null;
  var extra=c.filter(function(x){return x.n>mn;}).map(function(x){return x.name+' +'+(x.n-mn)+' solo';});
  return 'do '+mn+' as a superset, then '+extra.join(' · ');
}

/* ---------- logging + history ---------- */
var LS_KEY='lift-logs', memStore=null;
// Load from disk ONCE, then treat the in-memory store as the source of truth
// (write-through). This way a failed setItem (private mode / quota) doesn't get
// clobbered by a stale re-read on the next render.
function loadLogs(){
  if(memStore===null){
    memStore={};
    try{var r=localStorage.getItem(LS_KEY);if(r){var p=JSON.parse(r);if(p&&typeof p==='object')memStore=p;}}catch(e){}
  }
  return memStore;
}
function saveLogs(o){memStore=o;try{localStorage.setItem(LS_KEY,JSON.stringify(o));}catch(e){}}
function enc(s){return encodeURIComponent(s);}
function dec(s){return decodeURIComponent(s);}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){var p=s.split('-');return parseInt(p[1])+'/'+parseInt(p[2]);}
function logsFor(name){var all=loadLogs();return all[name]||[];}
function isLoggedToday(name){var h=logsFor(name);return !!(h.length && h[h.length-1].date===todayStr());}
// Coach recommendation for an exercise (suggested weight/range/cue), published in the program JSON.
function recFor(name){ try{ return (typeof PROGRAM==='object' && PROGRAM && PROGRAM.recs && PROGRAM.recs[name]) || null; }catch(e){ return null; } }
/* ---------- alternate-machine variants ----------
   A name containing " / " (e.g. "Incline Machine Press (low) / Cable Fly") is one
   slot with two interchangeable machines whose loads differ wildly. The log card
   shows a selector, and each entry records which variant (v) the weights belong
   to — so prefill never carries a press weight onto a fly. */
function variantsOf(name){
  var parts=String(name).split(' / ').map(function(s){return s.trim();}).filter(Boolean);
  return parts.length>1 ? parts : null;
}
var selVariant={};   // enc(name) → variant picked this session (default = last logged)
function currentVariant(name){
  var vs=variantsOf(name); if(!vs) return null;
  var sel=selVariant[enc(name)]; if(sel && vs.indexOf(sel)>=0) return sel;
  var h=logsFor(name);
  for(var i=h.length-1;i>=0;i--){ if(h[i].v && vs.indexOf(h[i].v)>=0) return h[i].v; }
  return vs[0];
}
// Most recent entry for a variant. Entries logged before variants existed have
// no v — treat those as belonging to the FIRST variant only.
function lastEntryFor(name,variant){
  var h=logsFor(name);
  if(!variant) return h.length?h[h.length-1]:null;
  var vs=variantsOf(name)||[];
  for(var i=h.length-1;i>=0;i--){ if((h[i].v||vs[0])===variant) return h[i]; }
  return null;
}
// Rec values for a name+variant. Slashed exercises only take WEIGHTS from a
// per-variant rec (recs[name].v[variant]) — a flat w could be the wrong machine,
// so without one the rec is cue-only.
function recValsFor(name,variant){
  var r=recFor(name); if(!r) return null;
  if(!variant) return r;
  var pv=(r.v && r.v[variant]) || null;
  if(pv) return {w:pv.w, lo:pv.lo, hi:pv.hi, cue:(pv.cue!=null?pv.cue:r.cue)};
  return {cue:r.cue};
}
/* ---------- session overrides (Ticket 06): swap / add / set-count ----------
   Per-session, per-day: when a machine is taken, swap in an equivalent; add a
   bonus exercise; or change today's set count. NEVER written into the published
   program — kept in localStorage for today only and discarded tomorrow. */
var OV_KEY='lift-overrides', sessionOv=null;
function loadOv(){
  if(sessionOv) return sessionOv;
  sessionOv={date:todayStr(), swaps:{}, added:{}, sets:{}};
  try{
    var r=localStorage.getItem(OV_KEY);
    if(r){ var p=JSON.parse(r);
      if(p && p.date===todayStr()){ sessionOv=p; sessionOv.swaps=sessionOv.swaps||{}; sessionOv.added=sessionOv.added||{}; sessionOv.sets=sessionOv.sets||{}; } }
  }catch(e){}
  return sessionOv;
}
function saveOv(){ try{ localStorage.setItem(OV_KEY, JSON.stringify(loadOv())); }catch(e){} }
// Apply a session swap to a program exercise array. Returns [name, reps, note,
// tags, originalName?] — index 4 present only when swapped (drives the badge).
function effectiveEx(ex){
  var ov=loadOv().swaps[ex[0]];
  if(!ov) return ex;
  return [ov.name, ex[1], ex[2], ex[3], ex[0]];
}
function addedFor(day){ return loadOv().added[day]||[]; }
// Master exercise library (the coach's curated list — publishable as top-level
// `exLib` in the program JSON; this bundled set is the fallback).
var EX_LIB_DEFAULT={
  'Chest':['Incline DB Press','Flat Machine Press','Pec Deck','Cable Fly','Push-up'],
  'Back':['Lat Pulldown','Seated Cable Row','Chest-supported Row','Single-arm DB Row','Straight-arm Pulldown'],
  'Shoulders':['Machine Shoulder Press','Cable Lateral Raise','Lateral Raise Machine','Rear-delt Fly','Face Pull'],
  'Biceps':['Dumbbell Curl','Hammer Curl','Cable Curl','Preacher Curl'],
  'Triceps':['Rope Pushdown','Straight-bar Pushdown','Overhead Cable Extension','Skullcrusher'],
  'Legs':['Leg Extension','Leg Curl','Leg Press','Hack Squat','Walking Lunge','Hip Thrust','Calf Raise'],
  'Core':['Cable Crunch','Hanging Leg Raise','Ab Wheel','Plank']
};
function exLibData(){
  try{ if(PROGRAM && PROGRAM.exLib && typeof PROGRAM.exLib==='object' && !Array.isArray(PROGRAM.exLib) && Object.keys(PROGRAM.exLib).length) return PROGRAM.exLib; }catch(e){}
  return EX_LIB_DEFAULT;
}
// Coach-matched substitutes for one exercise (publishable top-level `alts` map).
function altsFor(name){
  try{ var a=PROGRAM && PROGRAM.alts && PROGRAM.alts[name]; return Array.isArray(a)?a:[]; }catch(e){ return []; }
}

// First-time guess, variant-aware. Shorthand left variants ("Belt / Pendulum
// Squat" → "Belt") borrow the trailing noun of the last variant ("Belt Squat")
// so the guess table can recognize them.
function guessFor(name){
  var vs=variantsOf(name);
  if(!vs) return startWeightFor(name);
  var v=currentVariant(name), g=startWeightFor(v);
  if(g===WEIGHT_START && vs.indexOf(v)<vs.length-1){
    var tail=vs[vs.length-1].split(' ').pop();
    g=startWeightFor(v+' '+tail);
  }
  return g;
}
// Weight-only summary. Shows the weights logged (e.g. "50, 55, 60 lb").
// Exercises with no load (bodyweight) just read "done ✓".
function setsSummary(sets){
  var ws=sets.filter(function(x){return x.w!=null;}).map(function(x){return x.w;});
  if(!ws.length) return 'done';
  return ws.join(', ')+' lb';
}
function lastLine(name){
  var h=logsFor(name); if(!h.length) return '';
  var last=h[h.length-1];
  var label=(last.date===todayStr())?'Today':fmtDate(last.date);
  return '<b>'+label+':</b> '+setsSummary(last.sets)+(last.v?' · '+last.v:'');
}
function setRowHTML(i,w,ph,suggested){
  // w = committed value; ph = ghost placeholder (heuristic guess, NOT saved if untouched);
  // suggested = a coach rec shown as an accent value (logs if saved, signalling it's a suggestion).
  return '<div class="setrow" data-i="'+i+'">'+
    '<span class="si">SET '+(i+1)+'</span>'+
    '<button class="stp" data-step="-5" aria-label="minus 5">−</button>'+
    '<input class="in-w'+(suggested?' suggested':'')+'" inputmode="decimal" placeholder="'+(ph!=null?ph:'—')+'" value="'+(w!=null?w:'')+'">'+
    '<span class="unit">lb</span>'+
    '<button class="stp" data-step="5" aria-label="plus 5">+</button>'+
    '<button class="rm" aria-label="remove set">×</button>'+
  '</div>';
}
var WEIGHT_START = 50;   // fallback start weight when the name gives no hint
// Guess a sensible FIRST-TIME starting weight from the exercise name, so the
// box opens near the real load (fewer taps). After the first log, the real
// weight prefills instead. Returns null for bodyweight moves (no load).
function startWeightFor(name){
  var s=String(name).toLowerCase();
  if(/push-?up|pull-?up|chin-?up/.test(s)) return null;             // bodyweight → leave empty
  var T=[
    [/leg press|hack squat|pendulum|belt squat|calf press|hip thrust/, 150],
    [/bulgarian|split squat|walking lunge|\blunge\b/, 40],
    [/squat|deadlift|\brdl\b|straight-leg|romanian/, 135],
    [/leg extension|hamstring curl|leg curl|ham curl/, 90],
    [/\bcalf\b/, 90],
    [/pushdown|pressdown|tricep|overhead extension|skull|kickback/, 40],   // triceps before generic "press"
    [/lat pulldown|pulldown|hammer row|chest-supported|machine row|seated row|cable row|bent-?over row|\bt-bar\b/, 100],
    [/shrug/, 80],
    [/single-arm|1-arm|\bkb\b|kettlebell/, 40],
    [/pec deck|machine press|machine shoulder press|incline machine|cable fly|chest press/, 90],
    [/press/, 50],                                                  // db / other presses
    [/upright row|front raise/, 25],
    [/lateral|rear-?delt|reverse fly|face pull/, 20],
    [/preacher|curl/, 30],
    [/\bfly\b|raise|extension/, 20]
  ];
  for(var i=0;i<T.length;i++){ if(T[i][0].test(s)) return T[i][1]; }
  return WEIGHT_START;
}
/* ---------- plate mode (Ticket 07): per-side plate picker ----------
   For plate-loaded / barbell lifts the coach tags by the name being LOGGED
   (variant for " / " exercises, else the plain name). Tracks added plates only
   (machine/bar base ignored); stores total w = 2 × Σ(per-side) plus the per-side
   array p, so prefill can re-load the exact plates. */
function plateSet(){ try{ var ps=(typeof PROGRAM==='object'&&PROGRAM&&PROGRAM.plateSet); return (Array.isArray(ps)&&ps.length)?ps:[45,35,25,10,5,2.5]; }catch(e){ return [45,35,25,10,5,2.5]; } }
function isPlateMode(name,variant){
  try{ var pm=(typeof PROGRAM==='object'&&PROGRAM&&PROGRAM.plateMode); if(!Array.isArray(pm)) return false;
    return pm.indexOf(name)>=0 || (variant && pm.indexOf(variant)>=0);
  }catch(e){ return false; }
}
function perSideLabel(arr){           // [45,45,25] → "45×2 · 25"
  if(!arr||!arr.length) return '';
  var out=[], i=0;
  while(i<arr.length){ var v=arr[i], c=1; while(i+c<arr.length&&arr[i+c]===v) c++; out.push(c>1?(v+'×'+c):(''+v)); i+=c; }
  return out.join(' · ');
}
function plateTotal(arr){ return (arr||[]).reduce(function(s,x){return s+x;},0)*2; }
function plateRowHTML(i,pArr){
  pArr=pArr||[];
  var has=pArr.length>0;
  return '<div class="setrow plate" data-i="'+i+'" data-p="'+pArr.join(',')+'">'+
    '<div class="prow-head"><span class="si">SET '+(i+1)+'</span>'+
      '<span class="pstack">'+(has?perSideLabel(pArr):'<span class="pstack-empty">add plates / side</span>')+'</span>'+
      '<span class="ptotal">'+(has?(plateTotal(pArr)+' lb'):'')+'</span>'+
      '<button class="rm" aria-label="remove set">×</button></div>'+
    '<div class="pbtns">'+plateSet().map(function(pl){return '<button class="pbtn" data-pl="'+pl+'">'+pl+'</button>';}).join('')+
      '<button class="pbtn paux pundo" data-act="undo" aria-label="undo plate">↶</button>'+
      '<button class="pbtn paux pclear" data-act="clear" aria-label="clear plates">clr</button>'+
    '</div>'+
  '</div>';
}
function buildPanel(name,reps){
  var variant=variantsOf(name)?currentVariant(name):null;
  var plate=isPlateMode(name,variant);
  var ent=lastEntryFor(name,variant);
  var pf=ent?ent.sets:null;                           // prefill from the last session OF THIS VARIANT
  var rec=recValsFor(name,variant);
  var guess=guessFor(name);                           // null for bodyweight
  // bodyweight move with no coach weight → no number to log, just a "Mark done" entry (never for plate-loaded)
  if(!plate && guess==null && !(rec && rec.w!=null)){
    return '<div class="bw-note">Bodyweight — no weight to log.</div>'+
      '<div class="panel-actions"><button class="btn-save">✓ Mark done</button></div>';
  }
  var n=loadOv().sets[name] || ((pf&&pf.length)?pf.length:(setsOf(reps)||3));   // session set-count override wins
  var rows='';
  for(var i=0;i<n;i++){
    var s=(pf&&pf[i])?pf[i]:{};
    if(plate)                    rows+=plateRowHTML(i, (s.p&&s.p.length)?s.p:[]);   // plate picker, prefilled from stored p
    else if(s.w!=null)           rows+=setRowHTML(i, s.w, null, false);     // real history → plain value
    else if(rec && rec.w!=null)  rows+=setRowHTML(i, rec.w, null, true);    // coach rec → accent value (logs if saved)
    else                         rows+=setRowHTML(i, '', guess, false);     // heuristic guess → ghost placeholder
  }
  var hint=plate
    ? '<div class="panel-hint">Tap plates to load <b>one side</b> — the app doubles it for the total.'+(pf?' Prefilled from last time.':'')+'</div>'
    : (pf
      ? '<div class="panel-hint">Prefilled from your last '+(variant?variant:'session')+' — adjust and Save.</div>'
      : (rec && rec.w!=null
        ? '<div class="panel-hint">Suggested weight is filled in blue — Save to log it, or adjust first.</div>'
        : '<div class="panel-hint">Suggested start shown in grey — tap ＋ to use it, then Save.</div>'));
  var setsCtl='<div class="sets-ctl"><span class="sc-lab">Sets today</span>'+
    '<button class="sstep" data-d="-1" aria-label="fewer sets">−</button>'+
    '<span class="sc-n">'+n+'</span>'+
    '<button class="sstep" data-d="1" aria-label="more sets">+</button></div>';
  return hint+setsCtl+'<div class="setrows">'+rows+'</div>'+
    '<div class="panel-actions">'+
      '<button class="btn-add">+ Set</button>'+
      '<button class="btn-save">Save</button>'+
    '</div>';
}
function buildHistory(name){
  var h=logsFor(name).slice().reverse();
  if(!h.length) return '<div class="hist-item">No history yet.</div><div class="panel-actions"><button class="btn-cancel">Close</button></div>';
  var items=h.map(function(e){return '<div class="hist-item"><b>'+fmtDate(e.date)+'</b> &nbsp;'+setsSummary(e.sets)+(e.v?' · '+e.v:'')+'</div>';}).join('');
  return '<div class="hist-list">'+items+'</div><div class="panel-actions"><button class="btn-cancel">Close</button></div>';
}
function renumber(rows){var n=rows.querySelectorAll('.setrow .si');for(var i=0;i<n.length;i++){n[i].textContent='SET '+(i+1);}}
function refreshBlock(block,name){
  var last=block.querySelector('.last');
  var line=lastLine(name);
  if(line){last.className='last';last.innerHTML=line;}
  else{last.className='last empty';last.textContent='No log yet';}
  var btns=block.querySelector('.logbtns');
  if(logsFor(name).length && !btns.querySelector('.hist-btn')){
    var b=document.createElement('button');b.className='hist-btn';b.textContent='History';
    btns.insertBefore(b,btns.firstChild);
  }
}
document.addEventListener('click',function(ev){
  var t=ev.target; if(!t.closest) return;

  // ── session overrides: swap / remove-added / add-exercise / set-count ──
  // (these sit inside tappable headers, so they run before expand/collapse)
  var sw=t.closest('.swap-btn');
  if(sw){ Drawer.openSwap(dec(sw.dataset.orig)); return; }
  var ra=t.closest('.rm-added');
  if(ra){
    var rn=dec(ra.dataset.name), ov=loadOv();
    ov.added[curDay]=(ov.added[curDay]||[]).filter(function(a){return a.name!==rn;});
    saveOv(); if(openEx===ra.dataset.name) openEx=null;
    rerender(); return;
  }
  if(t.closest('.addex')){ Drawer.openAdd(); return; }
  var ss2=t.closest('.sstep');
  if(ss2){
    var sp=ss2.closest('.log-panel'), sb=sp&&sp.closest('.exblock'); if(!sb) return;
    var snm=dec(sb.dataset.ex), srp=dec(sb.dataset.reps||'');
    var cur2=parseInt((sp.querySelector('.sc-n')||{}).textContent)||3;
    var nv=Math.max(1, Math.min(8, cur2+parseInt(ss2.dataset.d)));
    loadOv().sets[snm]=nv; saveOv();
    sp.innerHTML=buildPanel(snm,srp); sp.dataset.mode='log';
    return;
  }

  // ── expand / collapse ──
  var bh=t.closest('.bhead');
  if(bh){
    var blk=bh.closest('.blk'), bi=blk.dataset.bi;
    if(blk.dataset.kind==='solo'){
      openEx=(openEx===blk.dataset.ex)?null:blk.dataset.ex;   // solo body IS its log card
    } else {
      if(openBlk[bi]){
        delete openBlk[bi];
        var encs=[].map.call(blk.querySelectorAll('.exrow'),function(r){return r.dataset.ex;});
        if(encs.indexOf(openEx)>=0) openEx=null;              // closing the block closes its open child
      } else { openBlk[bi]=1; }
    }
    rerender(); return;
  }
  var eh=t.closest('.exhead');
  if(eh){
    var exrow=eh.closest('.exrow'), en=exrow.dataset.ex, pb=exrow.closest('.blk');
    if(pb) openBlk[pb.dataset.bi]=1;                         // keep the superset open after the child collapses
    openEx=(openEx===en)?null:en;                            // one log card open at a time
    rerender(); return;
  }

  // ── variant selector (which machine am I logging?) ──
  var vchip=t.closest('.vchip');
  if(vchip){
    var vbk=vchip.closest('.exblock');
    if(vbk){ selVariant[vbk.dataset.ex]=dec(vchip.dataset.v); rerender(); }
    return;
  }

  // ── history toggle (inside an expanded exercise) ──
  var histBtn=t.closest('.hist-btn');
  if(histBtn){
    var hbk=histBtn.closest('.exblock'), hp=hbk&&hbk.querySelector('.log-panel'); if(!hp) return;
    var nm=dec(hbk.dataset.ex), rp=dec(hbk.dataset.reps||'');
    if(hp.dataset.mode==='hist'){ hp.innerHTML=buildPanel(nm,rp); hp.dataset.mode='log'; histBtn.textContent='History'; }
    else { hp.innerHTML=buildHistory(nm); hp.dataset.mode='hist'; histBtn.textContent='Back'; }
    return;
  }
  if(t.classList.contains('btn-cancel')){          // history "Close" → back to the log view
    var cp=t.closest('.log-panel'), cbk=cp&&cp.closest('.exblock');
    if(cp&&cbk){ cp.innerHTML=buildPanel(dec(cbk.dataset.ex),dec(cbk.dataset.reps||'')); cp.dataset.mode='log';
      var hb=cbk.querySelector('.hist-btn'); if(hb) hb.textContent='History'; }
    return;
  }

  // ── plate picker (add/undo/clear a per-side plate) ──
  var pbtn=t.closest('.pbtn');
  if(pbtn){
    var prow=pbtn.closest('.setrow.plate'); if(!prow) return;
    var arr=(prow.dataset.p||'').split(',').filter(Boolean).map(Number);
    if(pbtn.dataset.act==='undo') arr.pop();
    else if(pbtn.dataset.act==='clear') arr=[];
    else arr.push(parseFloat(pbtn.dataset.pl));
    prow.dataset.p=arr.join(',');
    prow.querySelector('.pstack').innerHTML = arr.length?perSideLabel(arr):'<span class="pstack-empty">add plates / side</span>';
    prow.querySelector('.ptotal').textContent = arr.length?(plateTotal(arr)+' lb'):'';
    return;
  }

  // ── weight stepper ──
  var stp=t.closest('.stp');
  if(stp){
    var row=stp.closest('.setrow'), inp=row.querySelector('.in-w');
    inp.classList.remove('suggested');                       // engaging it makes it a real value
    var raw=String(inp.value).trim(), cur;
    if(raw==='' || isNaN(parseFloat(raw))){                  // first tap on empty → snap to rec, else name-guess, else 50
      var blk2=row.closest('.exblock'), nm2=blk2?dec(blk2.dataset.ex):null;
      var vt2=(nm2&&variantsOf(nm2))?currentVariant(nm2):null;
      var rc=nm2?recValsFor(nm2,vt2):null;
      var base=(rc&&rc.w!=null)?rc.w:(nm2?guessFor(nm2):null);
      cur=(base==null)?WEIGHT_START:base;
    } else { cur=parseFloat(raw)+parseFloat(stp.dataset.step); }
    if(cur<0) cur=0;
    inp.value=String(Math.round(cur*100)/100);
    return;
  }
  if(t.classList.contains('btn-add')){
    var ap=t.closest('.log-panel'), rows=ap.querySelector('.setrows');
    if(!rows) return;
    var abk=ap.closest('.exblock'), anm=abk?dec(abk.dataset.ex):'', avar=variantsOf(anm)?currentVariant(anm):null;
    var idx=rows.querySelectorAll('.setrow').length;
    rows.insertAdjacentHTML('beforeend', isPlateMode(anm,avar)?plateRowHTML(idx,[]):setRowHTML(idx,null,null,false));
    return;
  }
  if(t.classList.contains('rm')){
    var rr=t.closest('.setrow'), rrs=rr.parentElement; rr.remove(); renumber(rrs); return;
  }

  // ── save ──
  if(t.classList.contains('btn-save')){
    var panel=t.closest('.log-panel'), block=panel.closest('.exblock'), name=dec(block.dataset.ex);
    function num(s){var n=Number(s); return (s!=='' && !isNaN(n))?n:null;}
    var sets=[], rowEls=panel.querySelectorAll('.setrow');
    if(rowEls.length){ rowEls.forEach(function(row){
      if(row.classList.contains('plate')){
        var arr=(row.dataset.p||'').split(',').filter(Boolean).map(Number);
        sets.push(arr.length?{w:plateTotal(arr), p:arr}:{w:null});   // plate row → total + per-side breakdown
      } else {
        sets.push({w:num(row.querySelector('.in-w').value.trim())});
      }
    }); }
    else { sets.push({w:null}); }                            // bodyweight "Mark done"
    var all=loadLogs(); if(!all[name]) all[name]=[];
    var ts=todayStr();
    all[name]=all[name].filter(function(e){return e.date!==ts;});  // one entry per day; re-save overwrites
    var entry={date:ts, day:curDay, wk:curWk, sets:sets};
    if(variantsOf(name)) entry.v=currentVariant(name);             // record which machine these weights belong to
    all[name].push(entry);
    saveLogs(all);
    liftPushState(); liftSyncLogs();
    openEx=null;                                             // collapse the logged exercise; keep its superset open
    panel.innerHTML='<div class="saved-flash">✓ Saved</div>';
    setTimeout(function(){ rerender(); }, 560);
    return;
  }
});

/* ---------- native widget bridge (no-op in a normal browser) ---------- */
function flattenExercises(d,wk){
  var list=[];
  (d[wk]||[]).forEach(function(b,gi){
    var isSS = b.t==='ss';
    b.e.forEach(function(raw){ var ex=effectiveEx(raw); list.push({name:ex[0], reps:ex[1], ss:isSS, grp:gi}); });
  });
  addedFor(curDay).forEach(function(a){ list.push({name:a.name, reps:'Bonus', ss:false, grp:-1}); });
  return list;
}
function currentExerciseIdx(list){
  var ts=todayStr();
  for(var i=0;i<list.length;i++){
    var h=logsFor(list[i].name);
    if(!(h.length && h[h.length-1].date===ts)) return i;   // first one not logged today
  }
  return list.length;                                        // all done
}
function liftPushState(){
  try{
    if(!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.lift)) return;
    var d=PROGRAM[curDay]; if(!d) return;
    var list=flattenExercises(d,curWk);
    window.webkit.messageHandlers.lift.postMessage(JSON.stringify({
      day: d.title.slice(0,3).toUpperCase(),
      title: d.title, sub: d.sub, week: curWk,
      accent: DAY_ACCENT[curDay]||'#7dd3fc',
      exercises: list, currentIndex: currentExerciseIdx(list), total: list.length
    }));
  }catch(e){}
}
function liftSyncLogs(){
  try{
    if(!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.liftSync)) return;
    window.webkit.messageHandlers.liftSync.postMessage(JSON.stringify({logs: loadLogs(), notes: loadNotes()}));
  }catch(e){}
}

/* ---------- daily session notes (Ticket 08) ----------
   Per (day, this-week's date) free-text feedback that uploads with the logs. */
function loadNotes(){ try{ var r=localStorage.getItem('lift-notes'); var o=r?JSON.parse(r):{}; return (o&&typeof o==='object')?o:{}; }catch(e){ return {}; } }
function saveNotesObj(o){ try{ localStorage.setItem('lift-notes', JSON.stringify(o)); }catch(e){} }
function noteKey(){
  var dt=dateForWeekday(DOW[curDay]);
  var k=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  return k+'|'+curDay;                    // e.g. "2026-06-12|fri" — lines up with that day's lifts
}
function currentNote(){ return loadNotes()[noteKey()]||''; }
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var SPECIAL_TAGS = {dropset:'DROP SET', partials:'PARTIALS', restpause:'REST-PAUSE', amrap:'AMRAP', failure:'TO FAILURE', tempo:'SLOW TEMPO'};
function tagBadges(ex){
  var tags = ex[3];                                   // optional 4th element: ["dropset", ...]
  if(!Array.isArray(tags) || !tags.length) return '';
  return '<div class="ex-badges">'+tags.map(function(t){
    var label = SPECIAL_TAGS[String(t).toLowerCase()] || String(t).toUpperCase();
    return '<span class="set-badge">'+label+'</span>';
  }).join('')+'</div>';
}
/* ---------- accordion render (T04) ---------- */
function recCardHTML(name){
  var variant=variantsOf(name)?currentVariant(name):null;
  var r=recValsFor(name,variant); if(!r) return '';
  var html='';
  if(r.w!=null){
    html+='<div class="rec"><div class="sug">'+r.w+'<small>lb</small></div>';
    if(r.lo!=null && r.hi!=null) html+='<div class="meta"><div class="lab">Work range</div><div class="rng">'+r.lo+'–'+r.hi+' lb</div></div>';
    html+='</div>';
  }
  if(r.cue) html+='<div class="cue"><b>Do this</b>'+r.cue+'</div>';
  return html;
}
// Variant selector chips ("which machine am I logging?") for slashed exercises.
function vselHTML(name){
  var vs=variantsOf(name); if(!vs) return '';
  var cur=currentVariant(name);
  return '<div class="vsel"><span class="vsel-lab">Logging for</span>'+vs.map(function(v){
    return '<button class="vchip'+(v===cur?' on':'')+'" data-v="'+enc(v)+'">'+v+'</button>';
  }).join('')+'</div>';
}
function lastLineFull(name){
  var hh=logsFor(name); if(!hh.length) return '';
  var done=isLoggedToday(name);
  var hist=(hh.length>1)?'<button class="hist-btn">History</button>':'';
  return '<div class="logbar"><span class="last'+(done?' done':'')+'">'+(done?'✓ ':'')+lastLine(name)+'</span><span class="logbtns">'+hist+'</span></div>';
}
function exerciseBodyHTML(name,reps){
  return vselHTML(name)+recCardHTML(name)+lastLineFull(name)+'<div class="log-panel" data-mode="log">'+buildPanel(name,reps)+'</div>';
}
function collapsedDoneLine(name){
  if(!isLoggedToday(name)) return '';
  var hh=logsFor(name), e=hh[hh.length-1];
  return '<div class="done-mini">✓ '+setsSummary(e.sets)+(e.v?' · '+e.v:'')+'</div>';
}
// Swap control (⇄) — sits inside the tappable header; handled before the
// expand/collapse branch so it never toggles the row. data-orig = ORIGINAL name.
function swapBtnHTML(origName){
  return '<span class="swap-btn" role="button" data-orig="'+enc(origName)+'" aria-label="swap exercise">⇄</span>';
}
function ovBadge(ex){ return (ex.length>4 && ex[4])?'<span class="ov-badge">Swapped</span>':''; }
function soloBlockHTML(b,bi){
  var raw=b.e[0], ex=effectiveEx(raw), name=ex[0], reps=ex[1], en=enc(name);
  var done=isLoggedToday(name), open=(openEx===en);
  return '<div class="group"><div class="solo-tag">● Solo · '+b.w+'</div>'+
    '<div class="blk exblock'+(done?' done':'')+(open?' open':'')+'" data-ex="'+en+'" data-reps="'+enc(reps)+'" data-bi="'+bi+'" data-kind="solo">'+
      '<button class="bhead" data-toggle="blk">'+
        '<span class="acc"></span>'+
        '<span class="ttl"><div class="where">'+name+ovBadge(ex)+'</div>'+tagBadges(ex)+collapsedDoneLine(name)+'</span>'+
        '<span class="rp">'+reps+'</span>'+
        swapBtnHTML(raw[0])+
        '<span class="chev">⌄</span>'+
      '</button>'+
      '<div class="bbody">'+(open?exerciseBodyHTML(name,reps):'')+'</div>'+
    '</div></div>';
}
function exRowHTML(raw,c){
  var ex=effectiveEx(raw), name=ex[0], reps=ex[1], en=enc(name);
  var done=isLoggedToday(name), open=(openEx===en);
  return '<div class="exrow exblock'+(done?' done':'')+(open?' open':'')+'" data-ex="'+en+'" data-reps="'+enc(reps)+'">'+
    '<button class="exhead" data-toggle="ex">'+
      '<span class="acc"></span>'+
      '<span class="nm">'+name+ovBadge(ex)+'</span>'+tagBadges(ex)+(done?'<span class="tick">✓</span>':'')+
      '<span class="rp">'+reps+'</span>'+
      swapBtnHTML(raw[0])+
      '<span class="chev">⌄</span>'+
    '</button>'+
    '<div class="exbody">'+(open?exerciseBodyHTML(name,reps):'')+'</div>'+
  '</div>';
}
// Session-added bonus exercise — its own teal block, loggable like any other.
function addedBlockHTML(a){
  var name=a.name, en=enc(name), reps='Bonus';
  var done=isLoggedToday(name), open=(openEx===en);
  return '<div class="group"><div class="solo-tag" style="color:#2dd4bf">＋ Added today</div>'+
    '<div class="blk exblock added'+(done?' done':'')+(open?' open':'')+'" data-ex="'+en+'" data-reps="'+enc(reps)+'" data-kind="solo" style="--c:#2dd4bf">'+
      '<button class="bhead" data-toggle="blk">'+
        '<span class="acc" style="background:#2dd4bf"></span>'+
        '<span class="ttl"><div class="where">'+name+'<span class="ov-badge add">Added</span></div>'+collapsedDoneLine(name)+'</span>'+
        '<span class="rm-added" role="button" data-name="'+en+'" aria-label="remove added exercise">✕</span>'+
        '<span class="chev">⌄</span>'+
      '</button>'+
      '<div class="bbody">'+(open?exerciseBodyHTML(name,reps):'')+'</div>'+
    '</div></div>';
}
function supersetBlockHTML(b,bi,c){
  var effs=b.e.map(effectiveEx);
  var containsOpen=effs.some(function(e){return openEx===enc(e[0]);});
  var open=!!openBlk[bi] || containsOpen;
  var names=effs.map(function(e){return e[0];}).join(' · ');
  var doneCount=effs.filter(function(e){return isLoggedToday(e[0]);}).length, allDone=(doneCount===b.e.length);
  var un=unevenNote(effs);
  var rows=(un?'<div class="uneven">⚠ '+un+'</div>':'')+b.e.map(function(ex){return exRowHTML(ex,c);}).join('');
  return '<div class="group"><div class="solo-tag" style="color:'+c+'">⛓ Superset</div>'+
    '<div class="blk ss'+(open?' open':'')+'" style="--c:'+c+'" data-bi="'+bi+'" data-kind="ss">'+
      '<button class="bhead" data-toggle="blk">'+
        '<span class="acc"></span>'+
        '<span class="ttl"><div class="where">'+names+'</div></span>'+   // show the exercise names, not the muscle label
        '<span class="cnt'+(allDone?' alldone':'')+'">'+(doneCount?doneCount+'/':'')+b.e.length+(allDone?' ✓':'')+'</span>'+
        '<span class="chev">⌄</span>'+
      '</button>'+
      '<div class="bbody">'+rows+'</div>'+
    '</div></div>';
}

var _firstRender=true;
function render(){
  if(typeof PROGRAM==='undefined'||!PROGRAM[curDay]){var c=document.getElementById('content');if(c)c.innerHTML='<div style="padding:24px;color:#fb7199;font-family:sans-serif">⚠ Could not load the program. Pull to refresh, or reopen the app.</div>';return;}
  if(!_firstRender) document.body.classList.add('ready');   // skip entrance animation on re-render
  applyDayAccent(curDay);                                    // tint everything to the day's color
  buildNav();
  const d=PROGRAM[curDay];
  const blocks=d[curWk]||d.A||d.B||[];   // single weekly program — always the A list (B ignored if present)
  let ssi=0;
  const flat=flattenExercises(d,curWk);
  const totalEx=flat.length;
  const doneEx=flat.filter(function(x){return isLoggedToday(x.name);}).length;
  const pct=totalEx?Math.round(doneEx/totalEx*100):0;
  let html=`<header class="head">
    <div class="today-marker">${todayMarker()}</div>
    <div class="kicker">Day ${d.n} · Phase 1</div>
    <h1>${d.title}</h1>
    <div class="sub">${d.sub}</div>
    <div class="tags">
      <span class="tag ${d.type==='pri'?'pri':'main'}">${d.type==='pri'?'Priority day':'Maintenance day'}</span>
      <span class="tag">~55 min + cardio</span>
    </div>
  </header>
  <div class="today">
    <div class="today-bar"><span style="width:${pct}%"></span></div>
    <div class="today-lab"><b>${doneEx}</b>/${totalEx} done today</div>
  </div>`;

  blocks.forEach(function(b,bi){
    if(b.t==='solo'){ html+=soloBlockHTML(b,bi); }
    else { var c=SS_COLORS[ssi%SS_COLORS.length]; ssi++; html+=supersetBlockHTML(b,bi,c); }
  });
  addedFor(curDay).forEach(function(a){ html+=addedBlockHTML(a); });
  html+='<button class="addex">＋ Add exercise</button>';

  const fin=d.fin||{core:'—'};                           // defensive: never crash on a sparse day
  const prg=d.prog||{c:'#7dd3fc',t:''};
  html+=`<div class="fin">
    <div class="core-block"><div class="lab">Core</div><div class="val">${fin.core}</div></div>
  </div>
  <div class="prog" style="--pc:${prg.c}">📌 ${prg.t}</div>
  <div class="notes">
    <div class="notes-lab">Session notes</div>
    <textarea class="notes-ta" id="sessionNotes" placeholder="How did today go? Soreness, energy, anything you changed…">${escHtml(currentNote())}</textarea>
  </div>`;

  document.getElementById('content').innerHTML=html;
  _firstRender=false;
  liftPushState();
}

/* ---------- live routine (web-editable, no app rebuild) ----------
   The live program is program.json in the repo, fetched at runtime from
   GitHub's raw URL. program.js (loaded above) is the offline / cold-start
   fallback. To change routines, edit program.json in GitHub's web editor —
   the app picks it up on next open (raw GitHub has a short CDN cache, so a
   change can take a few minutes to appear). */
const PROGRAM_API = "https://lift-sync-api.vercel.app/api/program";                         // live source (in-app publish)
const PROGRAM_URL = "https://raw.githubusercontent.com/travisworrell61/lift-app/main/program.json"; // GitHub fallback
function cachedProgram(){ try{ var r=localStorage.getItem('lift-program-cache'); return r?JSON.parse(r):null; }catch(e){ return null; } }
function setCachedProgram(p){ try{ localStorage.setItem('lift-program-cache', JSON.stringify(p)); }catch(e){} }
function normalizeProgram(data){
  var p=(data && data.program)?data.program:data;        // accept a raw object or { program: {...} }
  return (p && typeof p==='object' && !Array.isArray(p) && Object.keys(p).length) ? p : null;
}
// Structural check shared by the publish validator AND the runtime loader, so a
// malformed program can neither be published nor adopted from the network/cache.
// Returns null if OK, else a human-readable problem description.
function programIssue(p){
  if(!p || typeof p!=='object') return 'not an object';
  for(var i=0;i<ORDER.length;i++){
    var k=ORDER[i], d=p[k];
    if(!d || typeof d!=='object') return 'missing day "'+k+'" — all 4 days (mon, tue, wed, fri) are required';
    if(typeof d.title!=='string' || !d.title) return k+': missing "title"';
    if(typeof d.sub!=='string') return k+': missing "sub"';
    if(typeof d.warm!=='string') return k+': missing "warm"';
    if(!d.fin || typeof d.fin.core!=='string' || typeof d.fin.cardio!=='string') return k+': missing "fin" {core, cardio}';
    if(!d.prog || typeof d.prog.c!=='string' || typeof d.prog.t!=='string') return k+': missing "prog" {c, t}';
    if(!Array.isArray(d.A) || !d.A.length) return k+': "A" must be a non-empty array of blocks';
    for(var j=0;j<d.A.length;j++){
      var b=d.A[j];
      if(!b || !Array.isArray(b.e) || !b.e.length) return k+'.A['+j+']: block needs an "e" exercise array';
      for(var m=0;m<b.e.length;m++){
        var ex=b.e[m];
        if(!Array.isArray(ex) || typeof ex[0]!=='string' || typeof ex[1]!=='string') return k+'.A['+j+'].e['+m+']: exercise must be [name, reps, note?]';
      }
    }
  }
  return null;
}
async function fetchProgram(url){
  var res=await fetch(url+(url.indexOf('?')<0?'?':'&')+'t='+Date.now(), {cache:'no-store'});
  if(!res.ok) throw new Error('http '+res.status);
  var p=normalizeProgram(await res.json());
  return (p && !programIssue(p)) ? p : null;             // never adopt a structurally broken program
}
async function loadProgram(){
  var c=cachedProgram();
  if(c && !programIssue(c)){ PROGRAM=c; render(); }      // instant: last known good (validated)
  var prog=null;
  try{ prog=await fetchProgram(PROGRAM_API); }catch(e){}     // 1) Vercel (in-app publish)
  if(!prog){ try{ prog=await fetchProgram(PROGRAM_URL); }catch(e){} }   // 2) GitHub
  if(prog){ PROGRAM=prog; setCachedProgram(prog); render(); }           // 3) else bundled program.js stays
}

/* ───────── Update Program (publish to Vercel; long-press the LIFT logo) ───────── */
var Admin = (function(){
  var g=function(id){ return document.getElementById(id); };
  var TOKEN_KEY='lift-pub-token';
  function setStatus(msg,cls){ var s=g('admStatus'); s.textContent=msg||' '; s.className='adm-status'+(cls?' '+cls:''); }
  function parseInput(){
    var raw=g('admJson').value.trim();
    if(!raw) return {ok:false,msg:'Paste the routine JSON first.'};
    var data; try{ data=JSON.parse(raw); }catch(e){ return {ok:false,msg:'Not valid JSON — '+e.message}; }
    var prog=normalizeProgram(data);
    if(!prog) return {ok:false,msg:'Parsed, but that is not a program object.'};
    var issue=programIssue(prog);                        // same strict check the app uses before adopting
    if(issue) return {ok:false,msg:issue};
    var days=Object.keys(prog).filter(function(k){return ORDER.indexOf(k)>=0;});
    return {ok:true,prog:prog,days:days,good:days.length};
  }
  function validate(){
    var v=parseInput();
    if(!v.ok){ setStatus('✕ '+v.msg,'err'); return null; }
    setStatus('✓ Looks good — '+v.good+' day(s): '+v.days.join(', '),'ok');
    return v;
  }
  function publish(){
    var v=validate(); if(!v) return;
    var token=g('admToken').value.trim();
    if(!token){ setStatus('✕ Enter your publish token.','err'); return; }
    setStatus('Publishing…','');
    fetch(PROGRAM_API,{method:'POST',headers:{'content-type':'application/json','x-program-secret':token},body:JSON.stringify(v.prog)})
      .then(function(r){ return r.json().then(function(j){return {s:r.status,j:j};},function(){return {s:r.status,j:null};}); })
      .then(function(o){
        if(o.s===200){
          try{ localStorage.setItem(TOKEN_KEY, token); }catch(e){}
          setCachedProgram(v.prog); PROGRAM=v.prog; render();
          g('admJson').value='';                 // auto-clear the paste box after a successful publish
          setStatus('✓ Published — live on all your devices.','ok');
        } else if(o.s===401){ setStatus('✕ Wrong publish token.','err'); }
        else { setStatus('✕ '+((o.j&&o.j.error)||('error '+o.s)),'err'); }
      })
      .catch(function(){ setStatus('✕ Network error — try again.','err'); });
  }
  function open(){ try{ g('admToken').value=localStorage.getItem(TOKEN_KEY)||''; }catch(e){} setStatus(' '); g('admin').hidden=false; }
  function close(){ g('admin').hidden=true; }

  g('admClose').addEventListener('click',close);
  g('admClear').addEventListener('click',function(){ g('admJson').value=''; setStatus(' '); g('admJson').focus(); });
  g('admValidate').addEventListener('click',validate);
  g('admPublish').addEventListener('click',publish);

  // Primary, reliable entry: the gear in the nav (a normal tap).
  var gear=g('navGear'); if(gear) gear.addEventListener('click',function(e){ e.stopPropagation(); open(); });

  // Secondary: long-press the LIFT logo. Don't cancel on pointercancel — iOS
  // WKWebView fires it spuriously when it starts its own long-press gesture,
  // which used to kill the timer before it opened.
  var brand=document.querySelector('.brand'), lp=null;
  function lpStart(){ lp=setTimeout(open,600); }
  function lpEnd(){ if(lp){ clearTimeout(lp); lp=null; } }
  if(brand){
    brand.style.userSelect='none'; brand.style.webkitUserSelect='none';
    brand.addEventListener('pointerdown',lpStart);
    brand.addEventListener('pointerup',lpEnd);
    brand.addEventListener('pointerleave',lpEnd);
    brand.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  }
  return { open:open, close:close };
})();

/* ───────── Exercise picker drawer (Swap ⇄ / ＋ Add) — Ticket 06 ───────── */
var Drawer=(function(){
  var g=function(id){ return document.getElementById(id); };
  var mode='add', swapTarget=null;     // swapTarget = ORIGINAL program name
  function open(){ g('exScrim').hidden=false; g('exDrawer').hidden=false; g('drawerSearch').value=''; renderList(''); }
  function close(){ g('exScrim').hidden=true; g('exDrawer').hidden=true; }
  function openAdd(){ mode='add'; swapTarget=null; g('drawerTitle').textContent='Add an exercise'; open(); }
  function openSwap(orig){ mode='swap'; swapTarget=orig; g('drawerTitle').textContent='Swap · '+orig; open(); }
  function renderList(q){
    q=String(q||'').toLowerCase();
    var html='';
    if(mode==='swap'){
      if(loadOv().swaps[swapTarget]) html+='<button class="libitem restore" data-pick="__restore">↩ Restore original — '+swapTarget+'</button>';
      var alts=altsFor(swapTarget).filter(function(a){return a.toLowerCase().indexOf(q)>=0;});
      if(alts.length){
        html+='<div class="grp">Coach\'s alternates</div><div class="alt-chips">'+
          alts.map(function(a){return '<button class="vchip" data-pick="'+enc(a)+'">'+a+'</button>';}).join('')+'</div>';
      }
    }
    var lib=exLibData();
    Object.keys(lib).forEach(function(grp){
      var items=(lib[grp]||[]).filter(function(n){return String(n).toLowerCase().indexOf(q)>=0;});
      if(!items.length) return;
      html+='<div class="grp">'+grp+'</div>'+items.map(function(n){
        return '<button class="libitem" data-pick="'+enc(n)+'"><span>'+n+'</span><span class="pluss">＋</span></button>';
      }).join('');
    });
    html+='<div class="grp">Custom</div><div class="custom-row">'+
      '<input id="drawerCustom" type="text" autocomplete="off" placeholder="Type any exercise…">'+
      '<button class="drawer-custom-add">Add</button></div>';
    g('drawerBody').innerHTML=html;
  }
  function pick(name){
    var ov=loadOv();
    if(mode==='swap'){
      if(name==='__restore'){
        delete ov.swaps[swapTarget];
        if(openEx) openEx=enc(swapTarget);              // keep the restored card open
      } else {
        ov.swaps[swapTarget]={name:name};
        if(openEx) openEx=enc(name);                    // keep the swapped card open
      }
    } else {
      var arr=ov.added[curDay]||(ov.added[curDay]=[]);
      if(!arr.some(function(a){return a.name===name;})) arr.push({name:name});
      openEx=enc(name);                                 // open the new bonus card right away
    }
    saveOv(); close(); rerender();
  }
  document.addEventListener('click',function(ev){
    var t=ev.target; if(!t.closest) return;
    if(t.id==='exScrim' || t.closest('#drawerClose')){ close(); return; }
    var li=t.closest('[data-pick]');
    if(li && t.closest('#exDrawer')){ var v=li.dataset.pick; pick(v==='__restore'?'__restore':dec(v)); return; }
    if(t.closest('.drawer-custom-add')){
      var inp=g('drawerCustom'), val=(inp&&inp.value||'').trim();
      if(val) pick(val);
      return;
    }
  });
  document.addEventListener('input',function(ev){
    if(ev.target && ev.target.id==='drawerSearch') renderList(ev.target.value);
  });
  return {openAdd:openAdd, openSwap:openSwap, close:close};
})();

render();
loadProgram();
liftSyncLogs();   // re-upload the current log blob on every open — heals any save made offline

// Session notes: save locally as the user types (upload rides the next sync).
document.addEventListener('input', function(ev){
  if(ev.target && ev.target.id==='sessionNotes'){
    var o=loadNotes(), k=noteKey(), v=ev.target.value;
    if(v.trim()==='') delete o[k]; else o[k]=v;
    saveNotesObj(o);
  }
});

// Returning to the app (native webview resume / PWA tab focus): refresh the widget
// (auto-advances past midnight) and re-push logs so the cloud copy can't go stale.
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState!=='visible') return;
  liftSyncLogs();
  // refresh (widget + date rollover) — but never wipe a logging panel mid-entry
  if(!document.querySelector('.log-panel:not([hidden])')) render();
});
