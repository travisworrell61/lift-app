<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>LIFT — 4-Day Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1117; --bg2:#11151c; --panel:#161b23; --panel2:#1b212b;
    --ink:#e8edf4; --muted:#8893a3; --line:#242c38; --steel:#aeb9c9;
    --accent:#7dd3fc; --accent-ink:#06131c;   /* Slate theme accent */
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{overflow-x:hidden;}
  button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;}
  body{
    font-family:'Barlow',sans-serif;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;min-height:100vh;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(45,212,191,.07), transparent 60%),
      radial-gradient(900px 500px at -10% 20%, rgba(251,113,153,.06), transparent 55%),
      linear-gradient(180deg,var(--bg),var(--bg2));
    background-attachment:fixed; color:var(--ink); line-height:1.45;
    padding:0 0 48px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:500px;margin:0 auto;padding:14px;}

  /* ---------- sticky nav ---------- */
  .nav{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,rgba(11,13,18,.96),rgba(11,13,18,.86));
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:max(10px,env(safe-area-inset-top)) 14px 10px;
  }
  .nav-inner{max-width:500px;margin:0 auto;}
  .days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .day-btn{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:.82rem;
    letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
    border:1px solid var(--line);border-radius:10px;background:var(--panel);
    color:var(--muted);min-height:46px;padding:0;transition:.15s;text-align:center;
  }
  .day-btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}

  /* ---------- header ---------- */
  .head{position:relative;border:1px solid var(--line);border-radius:16px;
    padding:18px 18px 15px;background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,0));
    overflow:hidden;animation:rise .45s ease both;}
  .head::before{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:100% 7px;opacity:.5;pointer-events:none;}
  .kicker{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.32em;
    text-transform:uppercase;font-size:.68rem;color:#2dd4bf;}
  h1{font-family:'Anton',sans-serif;font-weight:400;font-size:2.9rem;line-height:.92;
    text-transform:uppercase;margin:4px 0 5px;}
  .sub{font-family:'Oswald',sans-serif;font-weight:500;text-transform:uppercase;
    letter-spacing:.1em;color:var(--steel);font-size:.9rem;}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;}
  .tag{font-family:'Oswald',sans-serif;font-size:.64rem;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);}
  .tag.pri{color:var(--bg);background:#fb7199;border-color:#fb7199;}
  .tag.main{color:var(--bg);background:#9fb0c9;border-color:#9fb0c9;}

  .rules{margin-top:11px;border:1px dashed var(--line);border-radius:12px;padding:10px 13px;
    display:flex;gap:7px 15px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);}
  .rules b{color:var(--ink);font-weight:600;}

  .warm{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:var(--panel);animation:rise .45s .04s ease both;}
  .warm .lab{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:.7rem;color:var(--muted);margin-bottom:3px;}
  .warm p{font-size:.9rem;color:var(--steel);}

  /* ---------- cards ---------- */
  .group{margin-top:13px;animation:rise .45s ease both;}
  .solo-tag{font-family:'Oswald',sans-serif;font-size:.6rem;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);margin:0 0 6px 4px;}
  .card{border:1px solid var(--line);border-radius:14px;background:var(--panel);
    padding:12px 14px;display:flex;align-items:center;gap:13px;position:relative;}
  .card + .card{margin-top:9px;}
  .accent{width:5px;align-self:stretch;border-radius:5px;background:var(--steel);flex:none;min-height:38px;}
  .ex{flex:1;min-width:0;}
  .ex .name{font-family:'Oswald',sans-serif;font-weight:600;font-size:1.02rem;letter-spacing:.01em;text-transform:uppercase;}
  .ex .note{font-size:.78rem;color:var(--muted);margin-top:2px;}
  .reps{font-family:'Anton',sans-serif;font-size:1.08rem;text-align:right;flex:none;white-space:nowrap;}
  .reps small{display:block;font-family:'Oswald',sans-serif;font-weight:500;font-size:.56rem;
    letter-spacing:.14em;color:var(--muted);text-transform:uppercase;}

  .ss{border-radius:16px;padding:11px;
    border:1px solid var(--c);
    border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));
    background:var(--panel);
    background:linear-gradient(180deg,color-mix(in srgb,var(--c) 10%,transparent),transparent 70%),var(--panel);
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 12%,transparent);}
  .ss-head{display:flex;align-items:center;gap:9px;margin:2px 2px 9px;flex-wrap:wrap;}
  .ss-pill{font-family:'Oswald',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:.18em;
    text-transform:uppercase;color:var(--bg);background:var(--c);border-radius:6px;padding:3px 9px;}
  .ss-where{font-family:'Oswald',sans-serif;font-size:.7rem;font-weight:500;text-transform:uppercase;letter-spacing:.09em;color:var(--c);}
  .ss .card{background:var(--panel2);border-color:color-mix(in srgb,var(--c) 22%,var(--line));}
  .ss .accent{background:var(--c);}
  .ss .reps{color:var(--c);}
  .link{display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Oswald',sans-serif;
    font-size:.58rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--c);padding:4px 0 2px;}
  .link::before,.link::after{content:"";height:1px;flex:1;background:color-mix(in srgb,var(--c) 35%,transparent);}
  .ex-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
  .set-badge{font-family:'Oswald',sans-serif;font-size:.56rem;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:#ffcf5c;border:1px solid rgba(255,207,92,.45);border-radius:6px;padding:2px 7px;}
  .ss-uneven-tag{font-family:'Oswald',sans-serif;font-size:.56rem;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:#ffcf5c;border:1px solid rgba(255,207,92,.4);border-radius:6px;
    padding:2px 7px;margin-left:auto;}
  .uneven{margin-top:9px;border-radius:9px;background:rgba(255,207,92,.12);
    border:1px dashed rgba(255,207,92,.55);color:#ffe2a0;font-family:'Oswald',sans-serif;
    font-size:.7rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    padding:8px 10px;text-align:center;line-height:1.35;}

  .fin{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);
    padding:13px 15px;display:flex;gap:16px;flex-wrap:wrap;animation:rise .45s .1s ease both;}
  .fin div{flex:1;min-width:115px;}
  .fin .lab{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:.66rem;color:var(--muted);}
  .fin .val{font-family:'Oswald',sans-serif;font-weight:600;font-size:.95rem;color:var(--steel);margin-top:2px;}

  .prog{margin-top:11px;border-left:4px solid var(--pc,#fb9a3c);border-radius:6px;
    background:color-mix(in srgb,var(--pc,#fb9a3c) 9%,var(--panel));padding:11px 14px;font-size:.84rem;color:var(--steel);animation:rise .45s .12s ease both;}
  .prog b{color:var(--ink);}

  .legend{margin-top:16px;display:flex;gap:13px;flex-wrap:wrap;justify-content:center;
    font-family:'Oswald',sans-serif;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .legend span{display:flex;align-items:center;gap:6px;}
  .dot{width:11px;height:11px;border-radius:3px;}

  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* compact phones */
  @media (max-width:360px){
    .wrap{padding:12px;}
    h1{font-size:2.4rem;}
    .ex .name{font-size:.95rem;}
    .reps{font-size:1rem;}
    .day-btn{font-size:.74rem;letter-spacing:.06em;}
  }
  /* never let a row push sideways */
  .card{flex-wrap:nowrap;}
  .ex{overflow-wrap:anywhere;}

  /* brand */
  .brand{font-family:'Anton',sans-serif;font-size:1.05rem;letter-spacing:.05em;color:var(--ink);
    display:flex;align-items:center;gap:7px;margin-bottom:9px;}
  .brand .dotmark{width:11px;height:11px;border-radius:3px;
    background:linear-gradient(135deg,#4ade80,#2dd4bf);transform:rotate(30deg);flex:none;}
  .brand small{font-family:'Oswald',sans-serif;font-weight:500;font-size:.6rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);margin-left:auto;}

  /* logging + history */
  .logbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 4px 0 10px;}
  .last{font-family:'Oswald',sans-serif;font-size:.78rem;color:var(--steel);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .last b{color:var(--ink);font-weight:600;}
  .last.empty{opacity:.45;font-style:italic;}
  .last.done{color:#7ef0b0;}
  .last.done b{color:#7ef0b0;}
  .logbtns{display:flex;gap:6px;flex:none;}
  .log-btn,.hist-btn{font-family:'Oswald',sans-serif;font-weight:600;font-size:.68rem;
    letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:9px;
    border:1px solid var(--line);background:transparent;color:var(--muted);padding:0 13px;min-height:36px;}
  .log-btn{color:#06231f;background:#2dd4bf;border-color:#2dd4bf;font-weight:700;}
  .exblock.done .log-btn{background:transparent;color:#7ef0b0;border-color:color-mix(in srgb,#4ade80 45%,var(--line));}
  .log-panel{margin:7px 2px 0;border:1px solid var(--line);border-radius:12px;
    background:var(--panel2);padding:11px;}
  .panel-hint{font-size:.74rem;color:var(--muted);margin:0 2px 10px;line-height:1.35;}
  /* weight-only set rows — one compact line each */
  .setrow{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);
    border-radius:11px;padding:8px 9px;margin-bottom:8px;}
  .setrow .si{font-family:'Oswald',sans-serif;font-weight:700;font-size:.64rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--steel);flex:none;width:46px;}
  .stp{width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:10px;
    background:var(--panel);color:var(--ink);font-size:1.5rem;line-height:1;cursor:pointer;
    font-family:'Barlow',sans-serif;display:flex;align-items:center;justify-content:center;}
  .stp:active{background:var(--panel2);}
  .in-w{width:72px;height:44px;flex:none;text-align:center;background:var(--bg2);
    border:1px solid color-mix(in srgb,#2dd4bf 34%,var(--line));border-radius:9px;color:var(--ink);
    font-size:1.18rem;font-weight:700;padding:0 4px;font-family:'Barlow',sans-serif;
    -webkit-appearance:none;appearance:none;}
  .in-w:focus{outline:none;border-color:#2dd4bf;}
  .in-w::placeholder{color:var(--muted);opacity:.5;font-weight:400;}
  .unit{font-family:'Oswald',sans-serif;font-size:.66rem;color:var(--muted);text-transform:uppercase;
    letter-spacing:.06em;flex:none;}
  .setrow .rm{width:30px;height:30px;flex:none;margin-left:auto;border:1px solid var(--line);
    border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1;}
  .panel-actions{display:flex;gap:8px;margin-top:2px;}
  .panel-actions button{flex:1;min-height:42px;border-radius:10px;cursor:pointer;
    font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    font-size:.72rem;border:1px solid var(--line);background:transparent;color:var(--muted);}
  .btn-add{flex:.7;}
  .btn-save{background:#2dd4bf;color:#06231f;border-color:#2dd4bf;}
  .hist-list{max-height:190px;overflow-y:auto;margin-bottom:9px;}
  .hist-item{font-family:'Oswald',sans-serif;font-size:.74rem;color:var(--muted);
    padding:5px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);}
  .hist-item:last-child{border-bottom:none;}
  .hist-item b{color:var(--ink);font-weight:600;}
  .saved-flash{color:#2dd4bf;font-size:.85rem;font-family:'Oswald',sans-serif;font-weight:700;
    letter-spacing:.08em;text-align:center;padding:14px;}

  /* logged-today state */
  .exblock.done .accent{background:linear-gradient(180deg,#4ade80,#2dd4bf);}
  .exblock.done .card{border-color:color-mix(in srgb,#4ade80 28%,var(--line));}
  .ss .exblock.done .card{border-color:color-mix(in srgb,#4ade80 30%,var(--c));}

  /* today progress bar */
  .today{display:flex;align-items:center;gap:11px;margin-top:13px;}
  .today-bar{flex:1;height:9px;border-radius:99px;background:var(--panel2);
    border:1px solid var(--line);overflow:hidden;}
  .today-bar span{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#4ade80,#2dd4bf);transition:width .4s ease;}
  .today-lab{font-family:'Oswald',sans-serif;font-weight:600;font-size:.68rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);flex:none;}
  .today-lab b{color:#7ef0b0;font-weight:700;}

  /* re-render: skip the entrance animation after first paint */
  body.ready .head,body.ready .warm,body.ready .group,body.ready .fin,
  body.ready .prog,body.ready .today{animation:none;}

  /* ───────── Slate theme — cohesive cool accent, minimal chrome ───────── */
  body{background:linear-gradient(180deg,#0e1117,#11151c);background-attachment:fixed;}
  .head::before{opacity:.25;}
  .brand .dotmark{background:linear-gradient(135deg,var(--accent),#a5b4fc);}
  .kicker{color:var(--accent);letter-spacing:.34em;}
  .day-btn{color:color-mix(in srgb,var(--dc,var(--muted)) 80%,#c9d2de);}
  .day-btn.on{background:var(--dc,var(--accent));color:#0b0f16;border-color:transparent;}
  /* T05: 2-line day tabs (label + current-week date) + today marker */
  .day-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:50px;line-height:1.05;}
  .db-date{font-family:'Oswald',sans-serif;font-weight:500;font-size:.6rem;letter-spacing:.02em;
    text-transform:none;color:var(--muted);}
  .day-btn.on .db-date{color:rgba(11,15,22,.6);}
  .today-marker{position:absolute;top:16px;right:18px;z-index:1;font-family:'Oswald',sans-serif;
    font-weight:600;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);}
  .today-marker b{color:var(--accent);font-weight:700;}
  .tag.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .tag.main{background:transparent;color:var(--steel);border-color:var(--line);}
  .prog{border-left-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 8%,var(--panel));}
  .log-btn{background:var(--ink);color:#11151c;border-color:transparent;}
  .exblock.done .log-btn{background:transparent;color:var(--accent);
    border-color:color-mix(in srgb,var(--accent) 45%,var(--line));}
  .exblock.done .accent{background:var(--accent);}
  .exblock.done .card{border-color:color-mix(in srgb,var(--accent) 26%,var(--line));}
  .ss .exblock.done .card{border-color:color-mix(in srgb,var(--accent) 30%,var(--c));}
  .last.done,.last.done b{color:var(--accent);}
  .today-bar span{background:var(--accent);}
  .today-lab b{color:var(--accent);}
  .in-w{border-color:color-mix(in srgb,var(--accent) 30%,var(--line));}
  .in-w:focus{border-color:var(--accent);}
  .panel-actions .btn-save{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;}
  .saved-flash{color:var(--accent);}

  /* ───────── core / ab timer ───────── */
  .core-timer-btn{margin-top:9px;display:inline-flex;align-items:center;gap:5px;
    font-family:'Oswald',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:.08em;
    text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border:none;
    border-radius:9px;padding:9px 13px;cursor:pointer;}
  .abt{position:fixed;inset:0;z-index:200;background:rgba(8,10,14,.975);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;
    padding:max(20px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));}
  .abt[hidden]{display:none;}
  .abt.rest{background:rgba(10,9,7,.975);}
  .abt-inner{width:100%;max-width:460px;text-align:center;}
  .abt-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .abt-top-btns{display:flex;gap:8px;}
  .abt-close.off{opacity:.5;}
  .abt-stage{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;font-size:.82rem;color:var(--accent);}
  .abt.rest .abt-stage{color:#ffb24d;}
  .abt-close{width:42px;height:42px;border:1px solid var(--line);border-radius:11px;
    background:transparent;color:var(--muted);font-size:1.1rem;cursor:pointer;}
  .abt-name{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:2.5rem;
    line-height:1.02;margin:6px 0 2px;}
  .abt-time{font-family:'Anton',sans-serif;font-size:6rem;line-height:1;color:var(--accent);
    font-variant-numeric:tabular-nums;}
  .abt.rest .abt-time{color:#ffb24d;}
  .abt-next{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.1em;
    color:var(--muted);font-size:.86rem;margin-top:6px;min-height:1em;}
  .abt-dots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:20px 0 24px;}
  .abt-dot{width:11px;height:11px;border-radius:50%;background:var(--line);transition:.2s;}
  .abt-dot.done{background:color-mix(in srgb,var(--accent) 55%,var(--line));}
  .abt-dot.cur{background:var(--accent);transform:scale(1.35);}
  .abt-controls{display:flex;gap:12px;justify-content:center;align-items:center;}
  .abt-btn{min-width:62px;height:58px;border-radius:14px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);font-size:1.3rem;cursor:pointer;}
  .abt-play{flex:1;max-width:210px;background:var(--accent);color:var(--accent-ink);
    border-color:var(--accent);font-family:'Oswald',sans-serif;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;font-size:1rem;}
  .abt-list{margin-top:22px;display:flex;flex-direction:column;gap:4px;max-height:26vh;
    overflow-y:auto;text-align:left;}
  .abt-li{font-family:'Oswald',sans-serif;font-size:.8rem;color:var(--muted);
    display:flex;justify-content:space-between;padding:5px 9px;border-radius:8px;}
  .abt-li.cur{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink);}
  .abt-li.done{opacity:.45;}
  .abt-li span:last-child{font-variant-numeric:tabular-nums;}

  /* ───────── Update Program admin ───────── */
  .adm{position:fixed;inset:0;z-index:210;background:rgba(8,10,14,.985);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
    padding:max(20px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));}
  .adm[hidden]{display:none;}
  .adm-inner{width:100%;max-width:460px;}
  .adm-top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 16px;}
  .adm-title{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:1.7rem;}
  .adm-lab{display:block;font-family:'Oswald',sans-serif;font-weight:600;font-size:.66rem;
    letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 2px 6px;}
  .adm-in,.adm-ta{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);font-size:1rem;padding:12px;font-family:'Barlow',sans-serif;
    -webkit-appearance:none;appearance:none;}
  .adm-in:focus,.adm-ta:focus{outline:none;border-color:var(--accent);}
  .adm-ta{min-height:230px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;
    line-height:1.4;resize:vertical;white-space:pre;overflow-wrap:normal;overflow-x:auto;}
  .adm-status{min-height:1.3em;font-family:'Oswald',sans-serif;font-size:.8rem;margin:11px 2px;color:var(--muted);}
  .adm-status.ok{color:#7ef0b0;}
  .adm-status.err{color:#fb7185;}
  .adm-actions{display:flex;gap:10px;}
  .adm-btn{flex:1;min-height:48px;border-radius:11px;cursor:pointer;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);font-family:'Oswald',sans-serif;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;font-size:.82rem;}
  .adm-pub{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1.4;}
  .adm-hint{font-size:.74rem;color:var(--muted);line-height:1.4;margin-top:14px;}
</style>
</head>
<body>

      <span><span class="dot" style="background:#fbbf24"></span>Superset</span>

  <!-- ───────── Core / ab interval timer (replaces the browser trip) ───────── -->

        <button class="abt-btn abt-play" id="abtPlay">Start</button>
        <button class="abt-btn" id="abtSkip" aria-label="skip">⏭</button>
      </div>

  <!-- ───────── Update Program (long-press the LIFT logo) ───────── -->

      <label class="adm-lab">New routine (paste the JSON from the chat)</label>

<script src="program.js"></script>
<script>
// Each superset gets its own color so its exercises read as a linked group.
const SS_COLORS = ['#34d399','#f472b6','#a78bfa','#fbbf24'];   // emerald · pink · violet · amber

// Each training day has its own accent color (drives the header, nav, progress, done-state).
const DAY_ACCENT = { mon:'#fb7185', tue:'#fbbf24', wed:'#a78bfa', fri:'#38bdf8' };  // rose · amber · violet · sky
function applyDayAccent(day){
  var c=DAY_ACCENT[day]||'#7dd3fc';
  document.documentElement.style.setProperty('--accent', c);
  document.documentElement.style.setProperty('--accent-ink', '#0b0f16');
}

let curDay='fri', curWk='A';
const ORDER=['mon','tue','wed','fri'];

const DOW={mon:1,tue:2,wed:3,fri:5};   // weekday index, Mon=1 … Sun=7
function dateForWeekday(targetDow){
  const now=new Date();
  const cur=now.getDay()||7;                 // 1..7 (Sun→7)
  const monday=new Date(now); monday.setDate(now.getDate()-(cur-1));   // this week's Monday
  const d=new Date(monday); d.setDate(monday.getDate()+(targetDow-1));
  return d;
}
const mmdd=(d)=>String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
function todayMarker(){ var n=new Date(); return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][n.getDay()]+' <b>'+mmdd(n)+'</b>'; }
function buildNav(){
  const days=document.getElementById('days');
  days.innerHTML=ORDER.filter(d=>PROGRAM[d]&&PROGRAM[d].title).map(d=>`<button class="day-btn ${d===curDay?'on':''}" data-d="${d}" style="--dc:${DAY_ACCENT[d]||'#7dd3fc'}"><span class="db-lab">${PROGRAM[d].title.slice(0,3)}</span><span class="db-date">${mmdd(dateForWeekday(DOW[d]))}</span></button>`).join('');
  days.querySelectorAll('button').forEach(b=>b.onclick=()=>{curDay=b.dataset.d;render();});
}

function setsOf(r){r=String(r);var m=r.match(/^(\d+)/);if(!m)return null;return (/[×x]/.test(r)||/sets/i.test(r))?parseInt(m[1]):null;}
function unevenNote(exs){
  var c=exs.map(function(e){return {name:e[0].split(/[·→]/)[0].trim(), n:setsOf(e[1])};}).filter(function(x){return x.n!=null;});
  if(c.length<2)return null;
  var mn=Math.min.apply(null,c.map(function(x){return x.n;}));
  var mx=Math.max.apply(null,c.map(function(x){return x.n;}));
  if(mn===mx)return null;
  var extra=c.filter(function(x){return x.n>mn;}).map(function(x){return x.name+' +'+(x.n-mn)+' solo';});
  return 'do '+mn+' as a superset, then '+extra.join(' · ');
}

/* ---------- logging + history ---------- */
var LS_KEY='lift-logs', memStore=null;
// Load from disk ONCE, then treat the in-memory store as the source of truth
// (write-through). This way a failed setItem (private mode / quota) doesn't get
// clobbered by a stale re-read on the next render.
function loadLogs(){
  if(memStore===null){
    memStore={};
    try{var r=localStorage.getItem(LS_KEY);if(r){var p=JSON.parse(r);if(p&&typeof p==='object')memStore=p;}}catch(e){}
  }
  return memStore;
}
function saveLogs(o){memStore=o;try{localStorage.setItem(LS_KEY,JSON.stringify(o));}catch(e){}}
function enc(s){return encodeURIComponent(s);}
function dec(s){return decodeURIComponent(s);}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){var p=s.split('-');return parseInt(p[1])+'/'+parseInt(p[2]);}
function logsFor(name){var all=loadLogs();return all[name]||[];}
function isLoggedToday(name){var h=logsFor(name);return !!(h.length && h[h.length-1].date===todayStr());}
// Weight-only summary. Shows the weights logged (e.g. "50, 55, 60 lb").
// Exercises with no load (bodyweight) just read "done ✓".
function setsSummary(sets){
  var ws=sets.filter(function(x){return x.w!=null;}).map(function(x){return x.w;});
  if(!ws.length) return 'done';
  return ws.join(', ')+' lb';
}
function lastLine(name){
  var h=logsFor(name); if(!h.length) return '';
  var last=h[h.length-1];
  var label=(last.date===todayStr())?'Today':fmtDate(last.date);
  return '<b>'+label+':</b> '+setsSummary(last.sets);
}
function defaultSetCount(name,reps){
  var h=logsFor(name);
  if(h.length && h[h.length-1].sets.length) return h[h.length-1].sets.length;
  var n=setsOf(reps); return n||3;
}
function setRowHTML(i,w,ph){
  // ph = suggested weight shown as GHOST placeholder text. It is not a value, so an
  // untouched row saves as null — a suggestion can never be logged as a lift by accident.
  return '<div class="setrow" data-i="'+i+'">'+
    '<span class="si">SET '+(i+1)+'</span>'+
    '<button class="stp" data-step="-5" aria-label="minus 5">−</button>'+
    '<input class="in-w" inputmode="decimal" placeholder="'+(ph!=null?ph:'—')+'" value="'+(w!=null?w:'')+'">'+
    '<span class="unit">lb</span>'+
    '<button class="stp" data-step="5" aria-label="plus 5">+</button>'+
    '<button class="rm" aria-label="remove set">×</button>'+
  '</div>';
}
var WEIGHT_START = 50;   // fallback start weight when the name gives no hint
// Guess a sensible FIRST-TIME starting weight from the exercise name, so the
// box opens near the real load (fewer taps). After the first log, the real
// weight prefills instead. Returns null for bodyweight moves (no load).
function startWeightFor(name){
  var s=String(name).toLowerCase();
  if(/push-?up|pull-?up|chin-?up/.test(s)) return null;             // bodyweight → leave empty
  var T=[
    [/leg press|hack squat|pendulum|belt squat|calf press|hip thrust/, 150],
    [/bulgarian|split squat|walking lunge|\blunge\b/, 40],
    [/squat|deadlift|\brdl\b|straight-leg|romanian/, 135],
    [/leg extension|hamstring curl|leg curl|ham curl/, 90],
    [/\bcalf\b/, 90],
    [/pushdown|pressdown|tricep|overhead extension|skull|kickback/, 40],   // triceps before generic "press"
    [/lat pulldown|pulldown|hammer row|chest-supported|machine row|seated row|cable row|bent-?over row|\bt-bar\b/, 100],
    [/shrug/, 80],
    [/single-arm|1-arm|\bkb\b|kettlebell/, 40],
    [/pec deck|machine press|incline machine|cable fly|chest press/, 90],
    [/press/, 50],                                                  // db / other presses
    [/upright row|front raise/, 25],
    [/lateral|rear-?delt|reverse fly|face pull/, 20],
    [/preacher|curl/, 30],
    [/\bfly\b|raise|extension/, 20]
  ];
  for(var i=0;i<T.length;i++){ if(T[i][0].test(s)) return T[i][1]; }
  return WEIGHT_START;
}
function buildPanel(name,reps){
  var h=logsFor(name);
  var pf=(h.length)?h[h.length-1].sets:null;          // prefill from last session
  var n=defaultSetCount(name,reps);
  var guess=startWeightFor(name);                     // null for bodyweight
  var rows='';
  for(var i=0;i<n;i++){
    var s=(pf&&pf[i])?pf[i]:{};
    // Real history prefills as a VALUE; a first-time guess shows as a ghost placeholder
    // only (one ＋ tap makes it real) — so accidental saves never log invented weights.
    var wv=(s.w!=null)?s.w:'';
    rows+=setRowHTML(i,wv,(pf||guess==null)?null:guess);
  }
  var hint=pf
    ? '<div class="panel-hint">Prefilled from last time — tap ＋/− (or type) to set each weight, then Save.</div>'
    : (guess!=null
        ? '<div class="panel-hint">Suggested start is shown in grey — tap ＋ once to use it, then adjust and Save.</div>'
        : '<div class="panel-hint">Bodyweight move — just tap Save to mark it done.</div>');
  return hint+'<div class="setrows">'+rows+'</div>'+
    '<div class="panel-actions">'+
      '<button class="btn-add">+ Set</button>'+
      '<button class="btn-cancel">Cancel</button>'+
      '<button class="btn-save">Save</button>'+
    '</div>';
}
function buildHistory(name){
  var h=logsFor(name).slice().reverse();
  if(!h.length) return '<div class="hist-item">No history yet.</div><div class="panel-actions"><button class="btn-cancel">Close</button></div>';
  var items=h.map(function(e){return '<div class="hist-item"><b>'+fmtDate(e.date)+'</b> &nbsp;'+setsSummary(e.sets)+'</div>';}).join('');
  return '<div class="hist-list">'+items+'</div><div class="panel-actions"><button class="btn-cancel">Close</button></div>';
}
function renumber(rows){var n=rows.querySelectorAll('.setrow .si');for(var i=0;i<n.length;i++){n[i].textContent='SET '+(i+1);}}
function refreshBlock(block,name){
  var last=block.querySelector('.last');
  var line=lastLine(name);
  if(line){last.className='last';last.innerHTML=line;}
  else{last.className='last empty';last.textContent='No log yet';}
  var btns=block.querySelector('.logbtns');
  if(logsFor(name).length && !btns.querySelector('.hist-btn')){
    var b=document.createElement('button');b.className='hist-btn';b.textContent='History';
    btns.insertBefore(b,btns.firstChild);
  }
}
document.addEventListener('click',function(ev){
  var t=ev.target; if(!t.closest) return;
  var logBtn=t.closest('.log-btn');
  if(logBtn){
    var block=logBtn.closest('.exblock'), panel=block.querySelector('.log-panel'), name=dec(block.dataset.ex);
    if(panel.hidden || panel.dataset.mode!=='log'){
      panel.innerHTML=buildPanel(name, dec(block.dataset.reps||'')); panel.hidden=false; panel.dataset.mode='log';
    } else { panel.hidden=true; }
    return;
  }
  var histBtn=t.closest('.hist-btn');
  if(histBtn){
    var block=histBtn.closest('.exblock'), panel=block.querySelector('.log-panel'), name=dec(block.dataset.ex);
    if(panel.hidden || panel.dataset.mode!=='hist'){
      panel.innerHTML=buildHistory(name); panel.hidden=false; panel.dataset.mode='hist';
    } else { panel.hidden=true; }
    return;
  }
  var stp=t.closest('.stp');
  if(stp){
    var row=stp.closest('.setrow'), inp=row.querySelector('.in-w');
    var raw=String(inp.value).trim(), cur;
    if(raw==='' || isNaN(parseFloat(raw))){            // first tap on an empty box → snap to the name-based guess
      var blk=row.closest('.exblock');
      var base=blk?startWeightFor(dec(blk.dataset.ex)):null;
      cur=(base==null)?WEIGHT_START:base;
    } else { cur=parseFloat(raw)+parseFloat(stp.dataset.step); }
    if(cur<0) cur=0;
    inp.value=String(Math.round(cur*100)/100);     // avoid float dust like 94.99999
    return;
  }
  if(t.classList.contains('btn-add')){
    var panel=t.closest('.log-panel');
    var rows=panel.querySelector('.setrows');
    rows.insertAdjacentHTML('beforeend', setRowHTML(rows.querySelectorAll('.setrow').length,null));
    return;
  }
  if(t.classList.contains('rm')){
    var row=t.closest('.setrow'), rows=row.parentElement; row.remove(); renumber(rows); return;
  }
  if(t.classList.contains('btn-cancel')){ t.closest('.log-panel').hidden=true; return; }
  if(t.classList.contains('btn-save')){
    var panel=t.closest('.log-panel'), block=panel.closest('.exblock'), name=dec(block.dataset.ex);
    function num(s){var n=Number(s); return (s!=='' && !isNaN(n))?n:null;}
    // Weight-only: each row logs a weight. Rows are kept even when blank so that
    // bodyweight moves (no load) still record a "done" entry when you tap Save.
    var sets=[];
    panel.querySelectorAll('.setrow').forEach(function(row){
      sets.push({w:num(row.querySelector('.in-w').value.trim())});
    });
    if(!sets.length){ panel.hidden=true; return; }
    var all=loadLogs(); if(!all[name]) all[name]=[];
    var ts=todayStr();
    all[name]=all[name].filter(function(e){return e.date!==ts;});  // one entry per day; re-save overwrites
    all[name].push({date:ts, day:curDay, wk:curWk, sets:sets});
    saveLogs(all);
    liftPushState();
    liftSyncLogs();
    panel.innerHTML='<div class="saved-flash">✓ Saved</div>';
    setTimeout(function(){ render(); }, 620);   // refresh done-state, progress bar & history button
    return;
  }
});

/* ---------- native widget bridge (no-op in a normal browser) ---------- */
function flattenExercises(d,wk){
  var list=[];
  (d[wk]||[]).forEach(function(b,gi){
    var isSS = b.t==='ss';
    b.e.forEach(function(ex){ list.push({name:ex[0], reps:ex[1], ss:isSS, grp:gi}); });
  });
  return list;
}
function currentExerciseIdx(list){
  var ts=todayStr();
  for(var i=0;i<list.length;i++){
    var h=logsFor(list[i].name);
    if(!(h.length && h[h.length-1].date===ts)) return i;   // first one not logged today
  }
  return list.length;                                        // all done
}
function liftPushState(){
  try{
    if(!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.lift)) return;
    var d=PROGRAM[curDay]; if(!d) return;
    var list=flattenExercises(d,curWk);
    window.webkit.messageHandlers.lift.postMessage(JSON.stringify({
      day: d.title.slice(0,3).toUpperCase(),
      title: d.title, sub: d.sub, week: curWk,
      accent: DAY_ACCENT[curDay]||'#7dd3fc',
      exercises: list, currentIndex: currentExerciseIdx(list), total: list.length
    }));
  }catch(e){}
}
function liftSyncLogs(){
  try{
    if(!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.liftSync)) return;
    window.webkit.messageHandlers.liftSync.postMessage(JSON.stringify(loadLogs()));
  }catch(e){}
}
// Ask the native shell to keep the screen awake (the browser wake-lock API is
// unreliable inside WKWebView). No-op in a plain browser / PWA.
function liftWake(on){
  try{
    if(!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.liftWake)) return;
    window.webkit.messageHandlers.liftWake.postMessage(on?'1':'0');
  }catch(e){}
}

var SPECIAL_TAGS = {dropset:'DROP SET', partials:'PARTIALS', restpause:'REST-PAUSE', amrap:'AMRAP', failure:'TO FAILURE', tempo:'SLOW TEMPO'};
function tagBadges(ex){
  var tags = ex[3];                                   // optional 4th element: ["dropset", ...]
  if(!Array.isArray(tags) || !tags.length) return '';
  return '<div class="ex-badges">'+tags.map(function(t){
    var label = SPECIAL_TAGS[String(t).toLowerCase()] || String(t).toUpperCase();
    return '<span class="set-badge">'+label+'</span>';
  }).join('')+'</div>';
}
function cardHTML(ex,color){
  const accent = color?`style="background:${color}"`:'';
  const reps = ex[1];
  const unit = /\/arm|\/leg/.test(reps)?'per side':(reps==='Burnout'?'to failure':(reps==='AMRAP'?'to failure':(reps==='4 sets'?'':'sets × reps')));
  const name = ex[0];
  const done = isLoggedToday(name);
  const line = lastLine(name);
  const hasHist = logsFor(name).length>0;
  const lastHTML = line
    ? `<span class="last${done?' done':''}">${done?'✓ ':''}${line}</span>`
    : `<span class="last empty">No log yet</span>`;
  const histBtn = hasHist?`<button class="hist-btn">History</button>`:'';
  const logLabel = done?'Edit':'＋ Log';
  return `<div class="exblock${done?' done':''}" data-ex="${enc(name)}" data-reps="${enc(reps)}">
    <div class="card">
      <div class="accent" ${accent}></div>
      <div class="ex"><div class="name">${name}</div>${tagBadges(ex)}${ex[2]?`<div class="note">${ex[2]}</div>`:''}</div>
      <div class="reps">${reps}${unit?`<small>${unit}</small>`:''}</div>
    </div>
    <div class="logbar">
      ${lastHTML}
      <span class="logbtns">${histBtn}<button class="log-btn">${logLabel}</button></span>
    </div>
    <div class="log-panel" hidden></div>
  </div>`;
}

var _firstRender=true;
function render(){
  if(typeof PROGRAM==='undefined'||!PROGRAM[curDay]){var c=document.getElementById('content');if(c)c.innerHTML='<div style="padding:24px;color:#fb7199;font-family:sans-serif">⚠ Could not load the program. Pull to refresh, or reopen the app.</div>';return;}
  if(!_firstRender) document.body.classList.add('ready');   // skip entrance animation on re-render
  applyDayAccent(curDay);                                    // tint everything to the day's color
  buildNav();
  const d=PROGRAM[curDay];
  const blocks=d[curWk]||d.A||d.B||[];   // single weekly program — always the A list (B ignored if present)
  let ssi=0;
  const flat=flattenExercises(d,curWk);
  const totalEx=flat.length;
  const doneEx=flat.filter(function(x){return isLoggedToday(x.name);}).length;
  const pct=totalEx?Math.round(doneEx/totalEx*100):0;
  let html=`<header class="head">
    <div class="today-marker">${todayMarker()}</div>
    <div class="kicker">Day ${d.n} · Phase 1</div>
    <h1>${d.title}</h1>
    <div class="sub">${d.sub}</div>
    <div class="tags">
      <span class="tag ${d.type==='pri'?'pri':'main'}">${d.type==='pri'?'Priority day':'Maintenance day'}</span>
      <span class="tag">~55 min + cardio</span>
    </div>
  </header>
  <div class="today">
    <div class="today-bar"><span style="width:${pct}%"></span></div>
    <div class="today-lab"><b>${doneEx}</b>/${totalEx} done today</div>
  </div>
  <div class="warm"><div class="lab">Warm-up · ~12 min</div><p>${d.warm}</p></div>`;

  blocks.forEach(b=>{
    if(b.t==='solo'){
      html+=`<div class="group"><div class="solo-tag">● Solo · ${b.w}</div>${cardHTML(b.e[0])}</div>`;
    } else {
      const c=SS_COLORS[ssi%SS_COLORS.length]; ssi++;
      let inner='';
      b.e.forEach((ex,i)=>{ inner+=cardHTML(ex,c); if(i<b.e.length-1) inner+=`<div class="link">↓ no rest ↓</div>`; });
      const un=unevenNote(b.e);
      const tag=un?`<span class="ss-uneven-tag">⚠ Uneven</span>`:'';
      const bar=un?`<div class="uneven">⚠ ${un}</div>`:'';
      html+=`<div class="group"><div class="ss" style="--c:${c}">
        <div class="ss-head"><span class="ss-pill">Superset</span><span class="ss-where">${b.w}</span>${tag}</div>
        ${inner}
        ${bar}
      </div></div>`;
    }
  });

  const fin=d.fin||{core:'—',cardio:'—'};               // defensive: never crash on a sparse day
  const prg=d.prog||{c:'#7dd3fc',t:''};
  html+=`<div class="fin">
    <div><div class="lab">Core</div><div class="val">${fin.core}</div>
      <button class="core-timer-btn" data-core-timer>▶ Core Timer</button></div>
    <div><div class="lab">Cardio</div><div class="val">${fin.cardio}</div></div>
  </div>
  <div class="prog" style="--pc:${prg.c}">📌 ${prg.t}</div>`;

  document.getElementById('content').innerHTML=html;
  _firstRender=false;
  liftPushState();
}

/* ---------- live routine (web-editable, no app rebuild) ----------
   The live program is program.json in the repo, fetched at runtime from
   GitHub's raw URL. program.js (loaded above) is the offline / cold-start
   fallback. To change routines, edit program.json in GitHub's web editor —
   the app picks it up on next open (raw GitHub has a short CDN cache, so a
   change can take a few minutes to appear). */
const PROGRAM_API = "https://lift-sync-api.vercel.app/api/program";                         // live source (in-app publish)
const PROGRAM_URL = "https://raw.githubusercontent.com/travisworrell61/lift-app/main/program.json"; // GitHub fallback
function cachedProgram(){ try{ var r=localStorage.getItem('lift-program-cache'); return r?JSON.parse(r):null; }catch(e){ return null; } }
function setCachedProgram(p){ try{ localStorage.setItem('lift-program-cache', JSON.stringify(p)); }catch(e){} }
function normalizeProgram(data){
  var p=(data && data.program)?data.program:data;        // accept a raw object or { program: {...} }
  return (p && typeof p==='object' && !Array.isArray(p) && Object.keys(p).length) ? p : null;
}
// Structural check shared by the publish validator AND the runtime loader, so a
// malformed program can neither be published nor adopted from the network/cache.
// Returns null if OK, else a human-readable problem description.
function programIssue(p){
  if(!p || typeof p!=='object') return 'not an object';
  for(var i=0;i<ORDER.length;i++){
    var k=ORDER[i], d=p[k];
    if(!d || typeof d!=='object') return 'missing day "'+k+'" — all 4 days (mon, tue, wed, fri) are required';
    if(typeof d.title!=='string' || !d.title) return k+': missing "title"';
    if(typeof d.sub!=='string') return k+': missing "sub"';
    if(typeof d.warm!=='string') return k+': missing "warm"';
    if(!d.fin || typeof d.fin.core!=='string' || typeof d.fin.cardio!=='string') return k+': missing "fin" {core, cardio}';
    if(!d.prog || typeof d.prog.c!=='string' || typeof d.prog.t!=='string') return k+': missing "prog" {c, t}';
    if(!Array.isArray(d.A) || !d.A.length) return k+': "A" must be a non-empty array of blocks';
    for(var j=0;j<d.A.length;j++){
      var b=d.A[j];
      if(!b || !Array.isArray(b.e) || !b.e.length) return k+'.A['+j+']: block needs an "e" exercise array';
      for(var m=0;m<b.e.length;m++){
        var ex=b.e[m];
        if(!Array.isArray(ex) || typeof ex[0]!=='string' || typeof ex[1]!=='string') return k+'.A['+j+'].e['+m+']: exercise must be [name, reps, note?]';
      }
    }
  }
  return null;
}
async function fetchProgram(url){
  var res=await fetch(url+(url.indexOf('?')<0?'?':'&')+'t='+Date.now(), {cache:'no-store'});
  if(!res.ok) throw new Error('http '+res.status);
  var p=normalizeProgram(await res.json());
  return (p && !programIssue(p)) ? p : null;             // never adopt a structurally broken program
}
async function loadProgram(){
  var c=cachedProgram();
  if(c && !programIssue(c)){ PROGRAM=c; render(); }      // instant: last known good (validated)
  var prog=null;
  try{ prog=await fetchProgram(PROGRAM_API); }catch(e){}     // 1) Vercel (in-app publish)
  if(!prog){ try{ prog=await fetchProgram(PROGRAM_URL); }catch(e){} }   // 2) GitHub
  if(prog){ PROGRAM=prog; setCachedProgram(prog); render(); }           // 3) else bundled program.js stays
}

/* ───────── Core / ab interval timer — pool + weekly shuffle (BUILD-QUEUE T03) ─────────
   Monday = weighted-leaning (6 weighted + 2 bodyweight); any other day = all bodyweight.
   Each week the pools are seed-shuffled by ISO week → a fresh circuit every week.
   8 work intervals + two 30s rests (~7 min). Paired moves run as two sided intervals;
   rests never split a pair. Pools are plain data — easy to edit (later: publishable). */
var AB_LEADIN = 5;   // seconds before the first move
var AB_POOLS = {
  weightedPool: [
    { ex:'Single-Arm Otis-Up', sec:50, pair:true },
    { ex:'DB Oblique Wipers', sec:45, pair:true },
    { ex:'Statue of Liberty → Thread-the-Needle', sec:50, pair:true },
    { ex:'Plank Reach-Outs', sec:45, note:'alternate arms' },
    { ex:'Dumbbell Sunrise-to-Sunset', sec:45 },
    { ex:'Russian Press', sec:45 },
    { ex:'Weighted Russian Twist', sec:45 },
    { ex:'Twisting Toe Taps', sec:45, note:'alternate sides' },
    { ex:'Recliner Presses', sec:45 },
    { ex:'Handoffs', sec:45, note:'pass DB hand to hand under legs' }
  ],
  bodyweightPool: [
    { ex:'Single-Single-Double V-Up', sec:45 },
    { ex:'Starfish Crunch', sec:45 },
    { ex:'X-Men Crunch', sec:45 },
    { ex:'Russian Twist (bodyweight)', sec:45 },
    { ex:'Penguins', sec:40, note:'side to side' },
    { ex:'Seated Ab Circles', sec:50, pair:true, pairLabels:['CW','CCW'] },
    { ex:'Plank Tuck-to-Kickback', sec:45, note:'alternate legs' },
    { ex:'Frog Crunches', sec:45 },
    { ex:'McDonald\'s', sec:45, note:'trace the M' },
    { ex:'Rainbows', sec:45, note:'arc side to side' },
    { ex:'Dragon Thrusts', sec:45 },
    { ex:'90-90 Crunches', sec:45 },
    { ex:'Canoe Crunch', sec:45 },
    { ex:'Hands Back Raises', sec:45 },
    { ex:'Recliner Elbow-to-Knee Tucks', sec:45, note:'alternate' },
    { ex:'"21" Crunch', sec:45 },
    { ex:'Figure 8\'s', sec:45 },
    { ex:'Tuck Planks (Same Side)', sec:45 },
    { ex:'Walk the Plank', sec:45, note:'alternate' },
    { ex:'Sprinter Tuck Planks', sec:45, note:'alternate' },
    { ex:'Heels to the Heavens', sec:45 },
    { ex:'Marching Planks', sec:45, note:'alternate' },
    { ex:'Scissor "V" Ups', sec:45 },
    { ex:'One Down Two Ups', sec:45 },
    { ex:'Twisting Pistons', sec:45, note:'alternate' },
    { ex:'Cross Hop Planks', sec:45 },
    { ex:'Prayer Crunch', sec:45 },
    { ex:'Scissors', sec:45 },
    { ex:'Side Crunches', sec:50, pair:true },
    { ex:'Russian "V" Tuck Twists', sec:45 }
  ]
};
function ab_mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function ab_shuffle(arr,seed){var r=ab_mulberry32(seed);var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function ab_isoWeek(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);var ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-ys)/86400000)+1)/7);}
// Build this week's circuit (8 work intervals + two 30s rests) deterministically from the day + ISO week.
function ab_buildCircuit(){
  // pools are publishable: if the live program JSON carries a `corePools` key, use it; else the bundled pools.
  var pools = (typeof PROGRAM==='object' && PROGRAM && PROGRAM.corePools
               && Array.isArray((PROGRAM.corePools.weightedPool)) && Array.isArray((PROGRAM.corePools.bodyweightPool)))
             ? PROGRAM.corePools : AB_POOLS;
  var now=new Date();
  var seed=ab_isoWeek(now);
  var isWeighted=(now.getDay()===1);                 // Monday = weighted-leaning; any other day = bodyweight
  var candidates;
  if(isWeighted){
    var w=ab_shuffle(pools.weightedPool, seed);
    var b=ab_shuffle(pools.bodyweightPool, seed+101);
    candidates=ab_shuffle(w.slice(0,6).concat(b.slice(0,2)), seed+777).concat(w.slice(6), b.slice(2));
  } else {
    candidates=ab_shuffle(pools.bodyweightPool, seed);
  }
  var TARGET=8, work=[], pairStart=[];
  for(var k=0;k<candidates.length && work.length<TARGET;k++){
    var ex=candidates[k];
    if(ex.pair){
      if(work.length<=TARGET-2){                       // only if both sides fit (never truncate a pair)
        var lbl=ex.pairLabels||['L','R'];
        pairStart.push(work.length);
        work.push({ex:ex.ex+' — '+lbl[0], sec:ex.sec, note:ex.note});
        work.push({ex:ex.ex+' — '+lbl[1], sec:ex.sec, note:ex.note});
      }
    } else {
      work.push({ex:ex.ex, sec:ex.sec, note:ex.note});
    }
  }
  function restSlot(i){ return pairStart.indexOf(i-1)>=0 ? i+1 : i; }   // don't split a pair
  var restAt={}; [restSlot(3),restSlot(6)].forEach(function(i){ if(i>0 && i<work.length) restAt[i]=1; });
  var seq=[];
  work.forEach(function(it,i){ if(restAt[i]) seq.push({rest:30}); seq.push(it); });
  var dayName=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][now.getDay()];
  return { seq:seq, work:work, title:dayName+' Core · Week '+seed };
}

var Ab = (function(){
  var el = function(id){ return document.getElementById(id); };
  var phases=[], pi=0, remaining=0, running=false, started=false, timer=null, endAt=0, lastSec=-1, wake=null, actx=null;
  var voiceOn=true, curAnnounced=false;
  var circuitWork=[], circuitTitle='';   // this week's generated exercises + label

  // ---- spoken cues (Web Speech API) ----
  function say(text){
    if(!voiceOn || !text) return;
    try{
      if(!('speechSynthesis' in window)) return;
      var u=new SpeechSynthesisUtterance(text);
      u.rate=1.0; u.pitch=1.0; u.volume=1.0; u.lang='en-US';
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function announcePhase(p){
    if(!p) return;
    if(p.kind==='work') say(p.label);
    else if(p.kind==='rest') say('Rest. Next up, '+(p.next||''));
    else if(p.kind==='ready') say('Get ready. First up, '+(p.next||''));
    else if(p.kind==='done') say('Workout complete. Great work.');
  }
  function callout(p,r){
    if(!p) return;
    if(p.kind==='work'){
      if(r===20 && p.sec>=40) say('20 seconds');
      else if(r===10) say('10 seconds left');
      else if(r<=3 && r>0) beep(900,0.12,0.25);          // work ending: beeps
    } else if((p.kind==='rest'||p.kind==='ready') && r<=3 && r>0){
      say(String(r));                                     // spoken 3·2·1 before the exercise
    }
  }

  function buildPhases(){
    var gen=ab_buildCircuit();
    circuitWork=gen.work; circuitTitle=gen.title;
    var seq=gen.seq, firstEx='';
    for(var f=0;f<seq.length;f++){ if(!seq[f].rest){ firstEx=seq[f].ex; break; } }
    phases=[{kind:'ready',label:circuitTitle,sec:AB_LEADIN,next:firstEx}];
    for(var i=0;i<seq.length;i++){
      var it=seq[i];
      if(it.rest){
        var nx=''; for(var j=i+1;j<seq.length;j++){ if(!seq[j].rest){ nx=seq[j].ex; break; } }
        phases.push({kind:'rest',label:'Rest',sec:it.rest,next:nx});
      } else {
        phases.push({kind:'work',label:it.ex,sec:it.sec,note:it.note});
      }
    }
    phases.push({kind:'done',label:'Done 🔥',sec:0});
  }
  function beep(freq,dur,vol){
    try{
      if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
      var o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=freq||880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001,actx.currentTime);
      g.gain.exponentialRampToValueAtTime(vol||0.25,actx.currentTime+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+(dur||0.16));
      o.start(); o.stop(actx.currentTime+(dur||0.16));
    }catch(e){}
  }
  function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
  function fmt(s){ if(s>=60){var m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0');} return String(s); }
  function workIndex(idx){ // 1-based exercise number for a work phase, else null
    var n=0; for(var i=0;i<=idx;i++){ if(phases[i].kind==='work') n++; } return n;
  }
  function draw(){
    var p=phases[pi]; if(!p) return;
    var rest = (p.kind==='rest'||p.kind==='ready');
    el('abtimer').classList.toggle('rest', rest);
    el('abtStage').textContent = p.kind==='work' ? ('Exercise '+workIndex(pi)+' / '+circuitWork.length)
                              : p.kind==='done' ? 'Complete' : (p.kind==='ready'?circuitTitle:'Rest');
    el('abtName').innerHTML = (p.kind==='work' && p.note)
      ? (p.label+'<span style="display:block;font-size:.46em;opacity:.7;font-weight:400;margin-top:4px">'+p.note+'</span>')
      : p.label;
    el('abtTime').textContent = p.kind==='done' ? '✓' : fmt(remaining);
    el('abtNext').innerHTML = p.next ? ('Next: '+p.next) : '&nbsp;';
    // dots = one per exercise
    el('abtDots').innerHTML = circuitWork.map(function(_,i){
      var cur=workIndex(pi); var cls = (p.kind==='work'&&i===cur-1)?'cur':(i<cur-1||(p.kind==='done'))?'done':((p.kind==='rest'&&i<cur)?'done':'');
      return '<span class="abt-dot '+cls+'"></span>';
    }).join('');
    el('abtList').innerHTML = circuitWork.map(function(it,i){
      var cur=workIndex(pi); var cls=(p.kind==='work'&&i===cur-1)?'cur':(i<cur-1?'done':'');
      return '<div class="abt-li '+cls+'"><span>'+(i+1)+'. '+it.ex+'</span><span>'+it.sec+'s</span></div>';
    }).join('');
    el('abtPlay').textContent = running ? 'Pause' : (p.kind==='done' ? 'Restart' : (started ? 'Resume' : 'Start'));
  }
  function tick(){
    var now=Date.now();
    var r=Math.max(0, Math.round((endAt-now)/1000));
    if(r!==lastSec){
      lastSec=r;
      remaining=r;
      callout(phases[pi], r);
      draw();
    }
    if(now>=endAt) next(true);
  }
  function startTick(){ clearInterval(timer); timer=setInterval(tick,150); }
  function play(){
    if(phases[pi] && phases[pi].kind==='done'){ openFresh(); }
    running=true; started=true; endAt=Date.now()+remaining*1000; lastSec=-1;
    reqWake();
    // iOS only allows audio started from a user gesture — this tap is it.
    // Create + resume the AudioContext here so the later timer-tick beeps are audible.
    try{
      if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended') actx.resume();
    }catch(e){}
    if(!curAnnounced){ announcePhase(phases[pi]); curAnnounced=true; }   // speak current phase on first start
    startTick(); draw();
  }
  function pause(){ running=false; clearInterval(timer); relWake();
    try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){} draw(); }
  function next(auto){
    if(pi>=phases.length-1){ // finished
      running=false; clearInterval(timer); relWake();
      pi=phases.length-1; remaining=0; draw();
      if(auto){ beep(660,0.5,0.3); buzz([120,60,120,60,240]); announcePhase(phases[pi]); }
      return;
    }
    pi++; remaining=phases[pi].sec; lastSec=-1; curAnnounced=true;
    if(phases[pi].kind==='work'){ beep(1046,0.18,0.3); buzz(180); }      // exercise start
    else if(phases[pi].kind==='done'){ beep(660,0.5,0.3); buzz([120,60,120,60,240]); }
    else { beep(523,0.16,0.22); buzz(80); }                              // rest
    announcePhase(phases[pi]);
    if(running){ endAt=Date.now()+remaining*1000; }
    draw();
  }
  function prev(){ if(pi>0){ pi--; remaining=phases[pi].sec; lastSec=-1; curAnnounced=true;
    if(running) endAt=Date.now()+remaining*1000; announcePhase(phases[pi]); draw(); } }
  function reqWake(){ try{ if('wakeLock' in navigator) navigator.wakeLock.request('screen').then(function(w){wake=w;}).catch(function(){}); }catch(e){} }
  function relWake(){ try{ wake&&wake.release&&wake.release(); }catch(e){} wake=null; }
  function openFresh(){ buildPhases(); pi=0; remaining=phases[0].sec; running=false; started=false; lastSec=-1; curAnnounced=false; }
  function open(){ openFresh(); el('abtimer').hidden=false; liftWake(true); draw(); }
  function close(){ running=false; clearInterval(timer); relWake(); liftWake(false);
    try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
    el('abtimer').hidden=true; }

  // wiring (overlay buttons are static)
  document.addEventListener('click',function(ev){
    var t=ev.target; if(t&&t.closest&&t.closest('[data-core-timer]')){ open(); }
  });
  el('abtPlay').addEventListener('click',function(){ running?pause():play(); });
  el('abtSkip').addEventListener('click',function(){ next(false); });
  el('abtPrev').addEventListener('click',function(){ prev(); });
  el('abtClose').addEventListener('click',function(){ close(); });
  el('abtVoice').addEventListener('click',function(){
    voiceOn=!voiceOn;
    el('abtVoice').textContent = voiceOn ? '🔊' : '🔇';
    el('abtVoice').classList.toggle('off', !voiceOn);
    if(!voiceOn){ try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){} }
    else { say('Voice on'); }   // also primes speech within this tap
  });
  // re-acquire wake lock if the user tabs back while running
  document.addEventListener('visibilitychange',function(){ if(running && document.visibilityState==='visible') reqWake(); });

  return { open:open, close:close };
})();

/* ───────── Update Program (publish to Vercel; long-press the LIFT logo) ───────── */
var Admin = (function(){
  var g=function(id){ return document.getElementById(id); };
  var TOKEN_KEY='lift-pub-token';
  function setStatus(msg,cls){ var s=g('admStatus'); s.textContent=msg||' '; s.className='adm-status'+(cls?' '+cls:''); }
  function parseInput(){
    var raw=g('admJson').value.trim();
    if(!raw) return {ok:false,msg:'Paste the routine JSON first.'};
    var data; try{ data=JSON.parse(raw); }catch(e){ return {ok:false,msg:'Not valid JSON — '+e.message}; }
    var prog=normalizeProgram(data);
    if(!prog) return {ok:false,msg:'Parsed, but that is not a program object.'};
    var issue=programIssue(prog);                        // same strict check the app uses before adopting
    if(issue) return {ok:false,msg:issue};
    var days=Object.keys(prog).filter(function(k){return ORDER.indexOf(k)>=0;});
    return {ok:true,prog:prog,days:days,good:days.length};
  }
  function validate(){
    var v=parseInput();
    if(!v.ok){ setStatus('✕ '+v.msg,'err'); return null; }
    setStatus('✓ Looks good — '+v.good+' day(s): '+v.days.join(', '),'ok');
    return v;
  }
  function publish(){
    var v=validate(); if(!v) return;
    var token=g('admToken').value.trim();
    if(!token){ setStatus('✕ Enter your publish token.','err'); return; }
    setStatus('Publishing…','');
    fetch(PROGRAM_API,{method:'POST',headers:{'content-type':'application/json','x-program-secret':token},body:JSON.stringify(v.prog)})
      .then(function(r){ return r.json().then(function(j){return {s:r.status,j:j};},function(){return {s:r.status,j:null};}); })
      .then(function(o){
        if(o.s===200){
          try{ localStorage.setItem(TOKEN_KEY, token); }catch(e){}
          setCachedProgram(v.prog); PROGRAM=v.prog; render();
          g('admJson').value='';                 // auto-clear the paste box after a successful publish
          setStatus('✓ Published — live on all your devices.','ok');
        } else if(o.s===401){ setStatus('✕ Wrong publish token.','err'); }
        else { setStatus('✕ '+((o.j&&o.j.error)||('error '+o.s)),'err'); }
      })
      .catch(function(){ setStatus('✕ Network error — try again.','err'); });
  }
  function open(){ try{ g('admToken').value=localStorage.getItem(TOKEN_KEY)||''; }catch(e){} setStatus(' '); g('admin').hidden=false; }
  function close(){ g('admin').hidden=true; }

  g('admClose').addEventListener('click',close);
  g('admClear').addEventListener('click',function(){ g('admJson').value=''; setStatus(' '); g('admJson').focus(); });
  g('admValidate').addEventListener('click',validate);
  g('admPublish').addEventListener('click',publish);

  // hidden entry: long-press the LIFT logo
  var brand=document.querySelector('.brand'), lp=null;
  function lpStart(){ lp=setTimeout(open,650); }
  function lpEnd(){ if(lp){ clearTimeout(lp); lp=null; } }
  if(brand){
    brand.style.userSelect='none'; brand.style.webkitUserSelect='none';
    brand.addEventListener('pointerdown',lpStart);
    brand.addEventListener('pointerup',lpEnd);
    brand.addEventListener('pointerleave',lpEnd);
    brand.addEventListener('pointercancel',lpEnd);
    brand.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  }
  return { open:open, close:close };
})();
