  function reqWake(){ try{ if('wakeLock' in navigator) navigator.wakeLock.request('screen').then(function(w){wake=w;}).catch(function(){}); }catch(e){} }
  function relWake(){ try{ wake&&wake.release&&wake.release(); }catch(e){} wake=null; }
  function openFresh(){ buildPhases(); pi=0; remaining=phases[0].sec; running=false; started=false; lastSec=-1; curAnnounced=false; }
  function open(){ openFresh(); el('abtimer').hidden=false; liftWake(true); draw(); }
  function close(){ running=false; clearInterval(timer); relWake(); liftWake(false);
    try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
    el('abtimer').hidden=true; }

  // wiring (overlay buttons are static)
  document.addEventListener('click',function(ev){
    var t=ev.target; if(t&&t.closest&&t.closest('[data-core-timer]')){ open(); }
  });
  el('abtPlay').addEventListener('click',function(){ running?pause():play(); });
  el('abtSkip').addEventListener('click',function(){ next(false); });
  el('abtPrev').addEventListener('click',function(){ prev(); });
  el('abtClose').addEventListener('click',function(){ close(); });
  el('abtVoice').addEventListener('click',function(){
    voiceOn=!voiceOn;

    el('abtVoice').classList.toggle('off', !voiceOn);
    if(!voiceOn){ try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){} }
    else { say('Voice on'); }   // also primes speech within this tap
  });

  document.addEventListener('visibilitychange',function(){ if(running && document.visibilityState==='visible') reqWake(); });

  return { open:open, close:close };
})();

// Publish-time sanity: which recs/alts/plateMode keys DON'T match a real exercise name
// (the most common silent two-chat failure — a "·"/space/quote typo shows nothing).
function programKeyWarnings(prog){
  try{
    var names={}, variants={};
    ORDER.forEach(function(dk){ var d=prog[dk]; if(!d||!Array.isArray(d.A)) return;
      d.A.forEach(function(b){ (b.e||[]).forEach(function(ex){ if(ex&&ex[0]){ names[ex[0]]=1;
        var vs=variantsOf(ex[0]); if(vs) vs.forEach(function(v){ variants[v]=1; }); } }); }); });
    function known(n){ return !!(names[n]||variants[n]); }
    function q(s){ return '“'+s+'”'; }
    var warns=[];
    function checkMap(obj,label){ if(obj && typeof obj==='object' && !Array.isArray(obj)){
      var bad=Object.keys(obj).filter(function(k){ return !known(k); });
      if(bad.length) warns.push(label+' for '+bad.slice(0,3).map(q).join(', ')+(bad.length>3?' +'+(bad.length-3):'')+' (no matching exercise — typo?)'); } }
    checkMap(prog.recs,'recs'); checkMap(prog.alts,'alts');
    if(Array.isArray(prog.plateMode)){ var bp=prog.plateMode.filter(function(k){ return !known(k); });
      if(bp.length) warns.push('plateMode '+bp.slice(0,3).map(q).join(', ')+(bp.length>3?' +'+(bp.length-3):'')+' (no matching exercise)'); }
    return warns;
  }catch(e){ return []; }
}

var Admin = (function(){
  var g=function(id){ return document.getElementById(id); };
  var TOKEN_KEY='lift-pub-token';
  function setStatus(msg,cls){ var s=g('admStatus'); s.textContent=msg||' '; s.className='adm-status'+(cls?' '+cls:''); }
  // One-tap clipboard read (iOS shows a Paste permission prompt). Falls back to manual paste.
  function pasteFromClipboard(){
    if(navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText().then(function(text){
        if(text && text.trim()){ g('admJson').value=text; validate(); }
        else { setStatus('Clipboard looks empty - copy the routine from the chat first.',''); g('admJson').focus(); }
      }).catch(function(){ setStatus('Could not read the clipboard - tap the box and paste manually.','err'); g('admJson').focus(); });
    } else { setStatus('Tap the box below and paste (hold, then Paste).',''); g('admJson').focus(); }
  }
  function parseInput(){
    var raw=g('admJson').value.trim();
    if(!raw) return {ok:false,msg:'Paste the routine JSON first.'};
    var data; try{ data=JSON.parse(raw); }catch(e){
      var m=String(e.message||''), pos=(m.match(/position (\d+)/)||[])[1];
      var near=pos!=null?(' — check near: …'+raw.slice(Math.max(0,pos-18), Number(pos)+12).replace(/\s+/g,' ')+'…'):'';
      return {ok:false,msg:'That isn’t valid JSON (a bracket, quote, or comma is off)'+near}; }
    var prog=normalizeProgram(data);
    if(!prog) return {ok:false,msg:'Parsed, but that is not a program object.'};
    var issue=programIssue(prog);                        // same strict check the app uses before adopting
    if(issue) return {ok:false,msg:issue};
    var days=Object.keys(prog).filter(function(k){return ORDER.indexOf(k)>=0;});
    return {ok:true,prog:prog,days:days,good:days.length};
  }
  function validate(){
    var v=parseInput();
    if(!v.ok){ setStatus('✕ '+v.msg,'err'); return null; }
    var warns=programKeyWarnings(v.prog);
    if(warns.length){ setStatus('✓ '+v.good+' days valid — heads up: '+warns.join(' · '),'warn'); }
    else { setStatus('✓ Looks good — '+v.good+' day(s): '+v.days.join(', '),'ok'); }
    return v;   // warnings don't block publishing (keys may be intentional)
  }
  function publish(){
    var v=validate(); if(!v) return;
    var token=g('admToken').value.trim();
    if(!token){ setStatus('✕ Enter your publish token.','err'); return; }
    setStatus('Publishing…','');
    fetch(PROGRAM_API,{method:'POST',headers:{'content-type':'application/json','x-program-secret':token},body:JSON.stringify(v.prog)})
      .then(function(r){ return r.json().then(function(j){return {s:r.status,j:j};},function(){return {s:r.status,j:null};}); })
      .then(function(o){
        if(o.s===200){
          try{ localStorage.setItem(TOKEN_KEY, token); }catch(e){}
          setCachedProgram(v.prog); PROGRAM=v.prog; render();
          g('admJson').value='';                 // auto-clear the paste box after a successful publish
          setStatus('✓ Published — this week’s routine is now live on all your devices.','ok');
        } else if(o.s===401){ setStatus('✕ Wrong publish token.','err'); }
        else { setStatus('✕ '+((o.j&&o.j.error)||('error '+o.s)),'err'); }
      })
      .catch(function(){ setStatus('✕ Network error — try again.','err'); });
  }
  function open(){ try{ g('admToken').value=localStorage.getItem(TOKEN_KEY)||''; }catch(e){} setStatus(' '); g('admin').hidden=false; }
  function close(){ g('admin').hidden=true; }

  g('admClose').addEventListener('click',close);
  g('admPaste').addEventListener('click',pasteFromClipboard);
  g('admClear').addEventListener('click',function(){ g('admJson').value=''; setStatus(' '); g('admJson').focus(); });
  g('admValidate').addEventListener('click',validate);
  g('admPublish').addEventListener('click',publish);

  // Primary, reliable entry: the gear in the nav (a normal tap).
  var gear=g('navGear'); if(gear) gear.addEventListener('click',function(e){ e.stopPropagation(); open(); });

  // Secondary: long-press the LIFT logo. Don't cancel on pointercancel — iOS
  // WKWebView fires it spuriously when it starts its own long-press gesture,
  // which used to kill the timer before it opened.
  var brand=document.querySelector('.brand'), lp=null;
  function lpStart(){ lp=setTimeout(open,600); }
  function lpEnd(){ if(lp){ clearTimeout(lp); lp=null; } }
  if(brand){
    brand.style.userSelect='none'; brand.style.webkitUserSelect='none';
    brand.addEventListener('pointerdown',lpStart);
    brand.addEventListener('pointerup',lpEnd);
    brand.addEventListener('pointerleave',lpEnd);
    brand.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  }
  return { open:open, close:close };
})();

/* ───────── Exercise picker drawer (Swap ⇄ / ＋ Add) — Ticket 06 ───────── */
var Drawer=(function(){
  var g=function(id){ return document.getElementById(id); };
  var mode='add', swapTarget=null;     // swapTarget = ORIGINAL program name
  function open(){ g('exScrim').hidden=false; g('exDrawer').hidden=false; g('drawerSearch').value=''; renderList(''); }
  function close(){ g('exScrim').hidden=true; g('exDrawer').hidden=true; }
  function openAdd(){ mode='add'; swapTarget=null; g('drawerTitle').textContent='Add an exercise'; open(); }
  function openSwap(orig){ mode='swap'; swapTarget=orig; g('drawerTitle').textContent='Swap · '+orig; open(); }
  function renderList(q){
    q=String(q||'').toLowerCase();
    var html='';
    if(mode==='swap'){
      if(loadOv().swaps[swapTarget]) html+='<button class="libitem restore" data-pick="__restore">↩ Restore original — '+swapTarget+'</button>';
      var alts=altsFor(swapTarget).filter(function(a){return a.toLowerCase().indexOf(q)>=0;});
      if(alts.length){
        html+='<div class="grp">Coach\'s alternates</div><div class="alt-chips">'+
          alts.map(function(a){return '<button class="vchip" data-pick="'+enc(a)+'">'+a+'</button>';}).join('')+'</div>';
      }
    }
    pickerGroups().forEach(function(g){
      var items=(g.names||[]).filter(function(n){return String(n).toLowerCase().indexOf(q)>=0;});
      if(!items.length) return;
      html+='<div class="grp">'+g.label+'</div>'+items.map(function(n){
        return '<button class="libitem" data-pick="'+enc(n)+'"><span>'+n+'</span><span class="pluss">＋</span></button>';
      }).join('');
    });
    html+='<div class="grp">Custom</div><div class="custom-row">'+
      '<input id="drawerCustom" type="text" autocomplete="off" placeholder="Type any exercise…">'+
      '<button class="drawer-custom-add">Add</button></div>';
    g('drawerBody').innerHTML=html;
  }
  function pick(name){
    var ov=loadOv();
    if(mode==='swap'){
      if(name==='__restore'){
        delete ov.swaps[swapTarget];
        if(openEx) openEx=enc(swapTarget);              // keep the restored card open
      } else {
        ov.swaps[swapTarget]={name:name};
        if(openEx) openEx=enc(name);                    // keep the swapped card open
      }
    } else {
      var arr=ov.added[curDay]||(ov.added[curDay]=[]);
      if(!arr.some(function(a){return a.name===name;})) arr.push({name:name});
      openEx=enc(name);                                 // open the new bonus card right away
    }
    saveOv(); close(); rerender();
  }
  document.addEventListener('click',function(ev){
    var t=ev.target; if(!t.closest) return;
    if(t.id==='exScrim' || t.closest('#drawerClose')){ close(); return; }
    var li=t.closest('[data-pick]');
    if(li && t.closest('#exDrawer')){ var v=li.dataset.pick; pick(v==='__restore'?'__restore':dec(v)); return; }
    if(t.closest('.drawer-custom-add')){
      var inp=g('drawerCustom'), val=(inp&&inp.value||'').trim();
      if(val) pick(val);
      return;
    }
  });
  document.addEventListener('input',function(ev){
    if(ev.target && ev.target.id==='drawerSearch') renderList(ev.target.value);
  });
  return {openAdd:openAdd, openSwap:openSwap, close:close};
})();

render();
loadProgram();
liftSyncLogs();   // re-upload the current log blob on every open — heals any save made offline

// Session notes: save locally as the user types (upload rides the next sync).
document.addEventListener('input', function(ev){
  if(ev.target && ev.target.id==='sessionNotes'){
    var o=loadNotes(), k=noteKey(), v=ev.target.value;
    if(v.trim()==='') delete o[k]; else o[k]=v;
    saveNotesObj(o);
  }
});

// Returning to the app (native webview resume / PWA tab focus): refresh the widget
// (auto-advances past midnight) and re-push logs so the cloud copy can't go stale.
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState!=='visible') return;
  liftSyncLogs();
  // refresh (widget + date rollover) — but never wipe an open log panel OR a field
  // being typed in (notes / weight), which would drop focus + the iOS keyboard.
  var ae=document.activeElement, typing=ae && (ae.tagName==='TEXTAREA'||ae.tagName==='INPUT');
  if(!typing && !document.querySelector('.log-panel:not([hidden])')) render();
});
</script>
<script>
  /* PWA: registers only when hosted on https; silently skips in preview/file:// */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js').catch(function () {});
    });
  }
</script>
