name: LIFT
options:
  bundleIdPrefix: com.travisworrell61
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: S8LYXGQ847
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  LIFT:
    type: application
    platform: iOS
    sources:
      - path: LIFTApp.swift
      - path: Secrets.swift
      - path: Shared
      - path: Assets.xcassets
    dependencies:
      - target: LIFTWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.travisworrell61.lift
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: LIFT
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    entitlements:
      path: LIFT.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.travisworrell61.lift
  LIFTWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: LIFTWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.travisworrell61.lift.widget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: LIFTWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: LIFT
    entitlements:
      path: LIFTWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.travisworrell61.lift
