name: LIFT
options:
  bundleIdPrefix: com.travisworrell61
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: S8LYXGQ847
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  LIFT:
    type: application
    platform: iOS
    sources:
      - path: LIFTApp.swift
      - path: Secrets.swift
      - path: Shared
      - path: Assets.xcassets
    dependencies:
      - target: LIFTWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.travisworrell61.lift
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Explicit Info.plist (replaces GENERATE_INFOPLIST_FILE) so we can declare WKAppBoundDomains —
    # the array WKWebView requires to run a service worker (paired with
    # limitsNavigationsToAppBoundDomains=true in LIFTApp.swift). Lists every domain the web app
    # navigates to or fetches from. The four keys below reproduce the old INFOPLIST_KEY_* settings.
    info:
      path: LIFT-Info.plist
      properties:
        CFBundleDisplayName: LIFT
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        WKAppBoundDomains:
          - travisworrell61.github.io
          - lift-sync-api.vercel.app
          - raw.githubusercontent.com
    entitlements:
      path: LIFT.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.travisworrell61.lift
  LIFTWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: LIFTWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.travisworrell61.lift.widget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: LIFTWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: LIFT
    entitlements:
      path: LIFTWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.travisworrell61.lift
